---
# Agent Configuration Manifest
# Single source of truth for all agents, models, and skills
# Generated by: Installation Agent
# Last Updated: 2026-05-02

version: "1.0"
metadata:
  framework: agentic-engineers
  format: agent-manifest
  compatible_with: "AGENTS.md, QUEUE-PROTOCOL.md"

agents:
  # Core Entry Point
  orchestrator:
    role: orchestrator
    model: claude-haiku-4.5
    effort: low
    description: "Queue polling, task routing, and DELEGATE/HANDBACK management"
    skills:
      - queue-management
      - routing
      - delegation
    tools:
      - bash
      - grep
      - view
    schedule: "continuous"
    poll_interval_seconds: 30

  # Standard Implementation
  engineer:
    role: engineer
    model: claude-haiku-4.5
    effort: medium
    description: "Well-scoped implementation, feature execution, bug fixes"
    skills:
      - implementation
      - testing
      - debugging
    tools:
      - bash
      - view
      - edit
      - grep
      - create

  # Complex Design & Architecture
  senior-engineer:
    role: senior-engineer
    model: claude-sonnet-4.5
    effort: high
    description: "Complex architecture, design patterns, deep debugging"
    skills:
      - architecture
      - design
      - mentoring
    tools:
      - bash
      - view
      - edit
      - grep
      - create
      - task

  # Code Review & Quality
  lead-engineer:
    role: lead-engineer
    model: claude-sonnet-4.5
    effort: high
    description: "Code review, quality assurance, team leadership"
    skills:
      - code-review
      - quality-assurance
      - mentoring
    tools:
      - bash
      - view
      - grep

  # Strategic & Architecture Review
  principal-engineer:
    role: principal-engineer
    model: claude-opus-4-7
    effort: high
    description: "Organization-wide architecture, strategic decisions, critical review"
    skills:
      - architecture
      - strategy
      - security-review
    tools:
      - bash
      - view
      - grep
      - task

  # Testing & Quality
  quality-engineer:
    role: quality-engineer
    model: claude-sonnet-4.5
    effort: high
    description: "Test strategy, quality metrics, coverage analysis"
    skills:
      - testing
      - quality-metrics
      - test-automation
    tools:
      - bash
      - view
      - edit
      - grep

  # Security
  security-engineer:
    role: security-engineer
    model: claude-opus-4-7
    effort: high
    description: "Security architecture, vulnerability analysis, compliance"
    skills:
      - security
      - compliance
      - vulnerability-analysis
    tools:
      - bash
      - view
      - grep
      - github-search

  # Specification Compliance
  spec-engineer:
    role: spec-engineer
    model: claude-sonnet-4.5
    effort: medium
    description: "Specification validation, compliance checking, drift detection"
    skills:
      - spec-validation
      - compliance-checking
    tools:
      - bash
      - view
      - grep

# Model Assignments (Cost Optimization)
model_assignments:
  claude-haiku-4.5:
    cost_per_1k_tokens: 0.80
    agents: [orchestrator, engineer]
    use_cases: [routing, simple-implementation, testing]

  claude-sonnet-4.5:
    cost_per_1k_tokens: 3.00
    agents: [senior-engineer, lead-engineer, quality-engineer, spec-engineer]
    use_cases: [architecture, code-review, complex-design]

  claude-opus-4-7:
    cost_per_1k_tokens: 15.00
    agents: [principal-engineer, security-engineer]
    use_cases: [strategic-review, security-audit, critical-decisions]

# Default Skill Installations
default_skills:
  orchestrator:
    - queue-management
    - routing
    - delegation

  engineer:
    - implementation
    - testing
    - debugging
    - metrics-etl

  senior-engineer:
    - architecture
    - design
    - mentoring
    - implementation

  lead-engineer:
    - code-review
    - quality-assurance
    - mentoring
    - lead-engineer-agent

  principal-engineer:
    - architecture
    - strategy
    - security-review
    - principal-engineer-agent

  quality-engineer:
    - testing
    - quality-metrics
    - test-automation
    - quality-engineer

  security-engineer:
    - security
    - compliance
    - vulnerability-analysis
    - security-engineer

  spec-engineer:
    - spec-validation
    - compliance-checking
    - spec-engineer

# Routing Rules (from AGENTS.md)
routing_rules:
  - name: "security-scoped"
    condition: "auth, crypto, data-protection, secrets, vulnerability"
    agent: security-engineer
    confidence: 0.92

  - name: "cross-service"
    condition: "2+ repos, architecture, major-refactor"
    agent: principal-engineer
    confidence: 0.90

  - name: "code-review"
    condition: "review PR, audit code, validate test quality"
    agent: lead-engineer
    confidence: 0.88

  - name: "complex-unscoped"
    condition: "investigation, design, root-cause, multiple-options"
    agent: senior-engineer
    confidence: 0.85

  - name: "well-scoped"
    condition: "clear requirements, step-by-step plan, estimated effort"
    agent: engineer
    confidence: 0.88

  - name: "fallback"
    condition: "all other tasks"
    agent: engineer
    confidence: 0.70

# Installation Configuration
installation:
  version: "1.0"
  timestamp: "2026-05-02T15:43:31.480+10:00"
  target_platforms: [copilot, claude]
  required_directories:
    - queue/incoming
    - queue/processing
    - queue/done
    - artifacts/delegates
    - artifacts/spans
  verification_checks:
    - queue_system_operational
    - orchestrator_installed
    - all_agents_installed
    - readme_documentation_created
