# DELEGATE Schema - Pre-flight validation specification
# Source: Quality Engineer DELEGATE-HANDBACK-QUALITY-GATES.md (Section 1)
#         Principal Engineer PROTOCOL-ARCHITECTURE-DESIGN.md (Sections 2-3)

required_fields:
  task_id:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
    description: "Unique task identifier in YYYY-MM-DD-kebab-case format"
    example: "2026-05-09-protocol-week1-validation"
    
  role:
    type: string
    enum:
      - engineer
      - senior_engineer
      - lead_engineer
      - principal_engineer
      - security_engineer
      - quality_engineer
      - model_engineer
    description: "Target agent role (must match AGENTS.md)"
    example: "senior_engineer"
    
  model:
    type: string
    description: "LLM model to use (default per role, override with justification)"
    example: "claude-haiku-4.5"
    default_by_role:
      engineer: "claude-haiku-4.5"
      senior_engineer: "claude-sonnet-4.6"
      lead_engineer: "claude-sonnet-4.6"
      principal_engineer: "claude-opus-4.7"
      security_engineer: "claude-sonnet-4.6"
      quality_engineer: "claude-sonnet-4.6"
      model_engineer: "claude-sonnet-4.6"
    
  effort:
    type: string
    enum:
      - low       # 1-4 hours
      - medium    # 5-16 hours
      - high      # 17-48 hours
      - max       # 49-120 hours
      - epic      # 121+ hours
    description: "Effort estimate (must align with estimated_hours)"
    example: "high"
    
  estimated_hours:
    type: integer
    minimum: 1
    description: "Estimated hours to complete (must match effort band)"
    effort_bands:
      low: [1, 4]
      medium: [5, 16]
      high: [17, 48]
      max: [49, 120]
      epic: [121, 999]
    example: 12
    
  scope:
    type: string
    min_length: 15
    description: "What will be done to what (≥15 words, action verb, concrete subject)"
    requirements:
      - minimum_words: 15
      - must_contain: "action verb (implement, create, fix, refactor, validate, etc)"
      - must_name: "specific subject or file"
    example: "Implement a comprehensive pre-flight validation system for DELEGATE and HANDBACK blocks, enforcing protocol compliance with 18 checks across three groups (A/B/C)."
    
  success_criteria:
    type: array
    min_items: 1
    description: "Measurable, testable success criteria (≥1 per 4 estimated_hours)"
    items:
      type: string
      min_length: 10
      requirements:
        - "Must be testable without reading implementation"
        - "Must be specific (not 'good code' or 'works well')"
        - "Should include test/validation method"
    min_count_formula: "ceil(estimated_hours / 4)"
    example:
      - "All 25 unit tests passing (100% pass rate)"
      - "Pre-commit hook blocks commits with bad DELEGATEs when run manually"
      - "Retry tracking prevents infinite rework loops (capped at 2)"
      
  plan:
    type: array
    min_items: 1
    description: "Numbered, concrete steps (≥1 per 4 estimated_hours, must include testing)"
    items:
      type: object
      required: ["step", "action", "duration_minutes"]
      properties:
        step:
          type: integer
          description: "Step number (1, 2, 3...)"
        action:
          type: string
          min_length: 15
          description: "Concrete action (reference specific files, commands, or outputs)"
        duration_minutes:
          type: integer
          minimum: 5
          description: "Estimated time for this step"
    min_count_formula: "ceil(estimated_hours / 4)"
    must_include_testing: true
    example:
      - step: 1
        action: "Create orchestration/delegate-schema.yaml with 10 required + 8 optional fields"
        duration_minutes: 30
      - step: 2
        action: "Implement validate_delegate_pre_flight() function with Groups A/B/C checks"
        duration_minutes: 120
      - step: 3
        action: "Write and run 25 unit tests, ensure 100% pass"
        duration_minutes: 150
        
  context:
    type: string
    min_length: 100
    description: "Background information sufficient for cold-start (≥100 words)"
    requirements:
      - "Explain why this task matters"
      - "Provide references to related work"
      - "Sufficient detail that agent needs no clarification questions"
    example: "Three specialist agents completed a comprehensive protocol review and architecture design. Quality Engineer identified 5 critical gaps in validation. Principal Engineer designed 5 architectural decisions with 400 LOC pseudocode. This task implements Week 1 Priority 1 tasks to enforce protocol compliance from the start."

subtask_fields:
  parent_task_id:
    type: string
    optional: true
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
    description: "Links this task to a parent task (required for sub-tasks, absent for root tasks)"
    validation:
      - "Must exist in done/, processing/, or incoming/ queue"
      - "Cannot link task to itself or any of its ancestors (cycle detection)"
    example: "2026-05-13-master-arch-review"

  task_tier:
    type: integer
    optional: true
    minimum: 0
    maximum: 5
    description: "Depth in task hierarchy (0=root, 1=child, 2=grandchild, max=5)"
    validation:
      - "Auto-calculated as parent task_tier + 1 (cannot be manually set to bypass limit)"
      - "Rejected if would exceed 5 (RuntimeError raised)"
      - "Root tasks have task_tier=0 (no parent_task_id)"
    example: 1

optional_fields:
  linked_issue:
    type: string
    description: "GitHub issue number (e.g., '#42')"
    example: "#1234"
    
  related_tasks:
    type: array
    items:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
    description: "List of task_ids that depend on or are related to this task"
    example:
      - "2026-05-15-priority2-routing-metrics"
      - "2026-05-20-priority3-ci-gate"
    
  quality_threshold:
    type: integer
    minimum: 0
    maximum: 100
    default: 80
    description: "Minimum quality score required for acceptance"
    
  escalation_threshold:
    type: integer
    minimum: 0
    maximum: 100
    default: 70
    description: "Score below which task escalates (gray zone at 70-79)"
    
  context_files:
    type: array
    items:
      type: string
    description: "List of reference files (relative paths) needed to understand context"
    example:
      - "orchestration/DELEGATE-HANDBACK-QUALITY-GATES.md"
      - "PRINCIPAL-ENGINEER-HANDBACK.md"
    
  preferred_language:
    type: string
    enum:
      - python
      - javascript
      - typescript
      - go
      - rust
      - java
      - shell
    description: "Preferred programming language (defaults to project primary language)"
    
  testing_framework:
    type: string
    description: "Preferred testing framework (e.g., pytest, jest, RSpec)"
    example: "pytest"
    
  out_of_scope:
    type: array
    items:
      type: string
    description: "Explicit list of what NOT to do (required for effort ≥ medium)"
    example:
      - "Gray-zone manual review gate (70-79 range)"
      - "Metrics collection and aggregation"
      - "CI/CD integration"
  
  security_scope:
    type: string
    enum:
      - none
      - auth
      - crypto
      - pii
      - secrets
      - injection
      - supply_chain
    default: none
    description: "Security classification for task (triggers routing to Security Engineer if set)"
    example: "auth"
  
  approval_gate:
    type: string
    enum:
      - none
      - lead_engineer
      - principal_engineer
      - security_engineer
      - cto
    default: none
    description: "Required approval authority before task execution"
    example: "principal_engineer"
  
  audit_required:
    type: boolean
    default: false
    description: "Whether task execution must be audited (required if approval_gate set)"
    example: true

# Validation Rules (enforced by orchestrator.py:validate_delegate_pre_flight)
validation_groups:
  
  group_a:
    name: "Structure (Hard gates)"
    description: "Any NO = do not send DELEGATE"
    checks:
      - id: "A1"
        rule: "task_id matches YYYY-MM-DD-kebab-case format"
        validator: "regex_match(task_id, '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$')"
        severity: "CRITICAL"
        
      - id: "A2"
        rule: "task_id is unique (not used elsewhere in session)"
        validator: "search_task_artifacts(task_id) == 0"
        severity: "CRITICAL"
        
      - id: "A3"
        rule: "role is valid (must match AGENTS.md)"
        validator: "role in ['engineer', 'senior_engineer', 'lead_engineer', 'principal_engineer', 'security_engineer', 'quality_engineer', 'model_engineer']"
        severity: "CRITICAL"
        
      - id: "A4"
        rule: "model matches role default OR has explicit justification"
        validator: "model == default_by_role[role] OR 'justification' in delegate"
        severity: "CRITICAL"
        
      - id: "A5"
        rule: "effort is appropriate for role (see mismatch table)"
        validator: "effort_role_check(effort, role)"
        severity: "CRITICAL"
        
      - id: "A6"
        rule: "scope is ≥15 words AND contains action verb AND names subject"
        validator: "scope_quality_check(scope)"
        severity: "CRITICAL"
        
      - id: "A7"
        rule: "No secrets in DELEGATE text (password, secret, token, api_key)"
        validator: "not any(pattern in delegate_text for pattern in ['password', 'secret', 'token', 'api_key', 'private_key'])"
        severity: "CRITICAL"
        
  group_b:
    name: "Content Quality (Refine before sending if fails)"
    description: "Any NO = rework DELEGATE before sending"
    checks:
      - id: "B1"
        rule: "success_criteria are measurable and testable (not 'good code')"
        validator: "all(is_measurable(criterion) for criterion in success_criteria)"
        severity: "HIGH"
        
      - id: "B2"
        rule: "success_criteria count ≥ ceil(estimated_hours / 4)"
        validator: "len(success_criteria) >= ceil(estimated_hours / 4)"
        severity: "HIGH"
        
      - id: "B3"
        rule: "plan steps are numbered and concrete (not 'implement the feature')"
        validator: "all(step['action'].has_specific_file_or_command() for step in plan)"
        severity: "HIGH"
        
      - id: "B4"
        rule: "at least one plan step references testing or test coverage"
        validator: "any('test' in step['action'].lower() for step in plan)"
        severity: "HIGH"
        
      - id: "B5"
        rule: "context provides sufficient background (≥100 words)"
        validator: "word_count(context) >= 100"
        severity: "MEDIUM"
        
      - id: "B6"
        rule: "scope is bounded with explicit out-of-scope for effort ≥ medium"
        validator: "effort in ['low'] OR 'out_of_scope' in delegate"
        severity: "MEDIUM"
        
      - id: "B7"
        rule: "effort is realistic (500+ lines → effort should be ≥ high)"
        validator: "estimate_scope_lines(scope) <= 500 OR effort in ['high', 'max', 'epic']"
        severity: "MEDIUM"
        
  group_c:
    name: "Routing Sanity (Re-route if fails)"
    description: "Any NO = re-route or upgrade role"
    checks:
      - id: "C1"
        rule: "effort=high/max → role is senior_engineer or above"
        validator: "effort in ['low', 'medium'] OR role in ['senior_engineer', 'lead_engineer', 'principal_engineer']"
        severity: "MEDIUM"
        
      - id: "C2"
        rule: "Security-scoped task → role = security_engineer"
        validator: "('security' not in scope.lower() and 'secure' not in scope.lower()) OR role == 'security_engineer'"
        severity: "MEDIUM"
        
      - id: "C3"
        rule: "Cross-service architecture → role = principal_engineer"
        validator: "('cross-service' not in scope.lower() and 'architecture' not in scope.lower()) OR role == 'principal_engineer'"
        severity: "MEDIUM"
        
      - id: "C4"
        rule: "Code review / validation → role = lead_engineer or quality_engineer"
        validator: "('review' not in scope.lower() and 'audit' not in scope.lower()) OR role in ['lead_engineer', 'quality_engineer']"
        severity: "MEDIUM"
  
  group_d:
    name: "Security Fields (Critical for security-scoped tasks)"
    description: "Any NO = invalid security configuration — reject DELEGATE"
    checks:
      - id: "D1"
        rule: "If security_scope set (not 'none'), approval_gate MUST be set (not 'none')"
        validator: "security_scope == 'none' OR approval_gate != 'none'"
        severity: "CRITICAL"
        
      - id: "D2"
        rule: "If approval_gate set (not 'none'), audit_required MUST be true"
        validator: "approval_gate == 'none' OR audit_required == true"
        severity: "CRITICAL"
        
      - id: "D3"
        rule: "If security_scope set (not 'none'), role MUST be security_engineer"
        validator: "security_scope == 'none' OR role == 'security_engineer'"
        severity: "CRITICAL"

# Effort × Role Mismatch Table
effort_role_matrix:
  low:
    minimum_role: engineer
    rationale: "Routine, well-defined, non-architectural"
    
  medium:
    minimum_role: engineer
    rationale: "Moderate complexity, some design decisions"
    
  high:
    minimum_role: senior_engineer
    rationale: "Design decisions required, technical depth"
    
  max:
    minimum_role: lead_engineer
    rationale: "Architecture impact, cross-module design"
    
  epic:
    minimum_role: principal_engineer
    rationale: "Cross-service, strategic, organization-wide impact"

# Red Flags Requiring Rework
red_flags:
  - pattern: "scope: 'Fix the bug'"
    issue: "Too vague"
    fix: "Add file:line, root cause, expected behavior"
    
  - pattern: "plan: 'Implement everything'"
    issue: "Not actionable"
    fix: "Number the steps, reference specific files/commands"
    
  - pattern: "success_criteria: 'Works well'"
    issue: "Not testable"
    fix: "What passes? What fails? Specific thresholds?"
    
  - pattern: "effort: low, plan: 12 steps"
    issue: "Underestimated effort"
    fix: "Upgrade to medium/high"
    
  - pattern: "role: engineer, effort: max"
    issue: "Mis-routed task"
    fix: "Upgrade to senior_engineer or lead_engineer"
    
  - pattern: "context: (empty or <50 words)"
    issue: "Insufficient background"
    fix: "Provide ≥100 words of context"
