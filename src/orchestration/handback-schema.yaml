# HANDBACK Schema - Post-execution validation specification
# Source: Quality Engineer DELEGATE-HANDBACK-QUALITY-GATES.md (Section 2)
#         Principal Engineer PROTOCOL-ARCHITECTURE-DESIGN.md (Sections 2-3)

required_fields:
  task_id:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
    description: "Must exactly match the DELEGATE task_id"
    example: "2026-05-09-protocol-week1-validation"
    
  status:
    type: string
    enum:
      - complete      # Task fully completed, all criteria met
      - failed        # Task failed, no deliverables produced
      - partial       # Task partially completed, some criteria met
      - blocked       # Task blocked by external dependency/unclear requirement
    description: "Final status of task execution"
    example: "complete"
    
  deliverables:
    type: array
    items:
      type: string
    description: "List of files/outputs created or modified (absolute paths)"
    min_items_by_effort:
      low: 1
      medium: 1
      high: 2
      max: 3
      epic: 5
    example:
      - "orchestration/delegate-schema.yaml"
      - "orchestration/handback-schema.yaml"
      - "orchestration/agents/orchestrator.py"
      - ".git/hooks/pre-commit"
      - "tests/test_protocol_validation.py"
      
  tests:
    type: object
    required: ["passed", "failed", "coverage"]
    properties:
      passed:
        type: integer
        minimum: 0
        description: "Number of passing tests"
        
      failed:
        type: integer
        minimum: 0
        description: "Number of failing tests"
        
      coverage:
        type: number
        minimum: 0
        maximum: 100
        description: "Test coverage percentage"
        
      framework:
        type: string
        description: "Testing framework used (pytest, unittest, etc)"
        
      notes:
        type: string
        description: "Any notes about test execution"
        
    description: "Test execution results (required for engineer-tier roles)"
    example:
      passed: 25
      failed: 0
      coverage: 95.5
      framework: "pytest"
      notes: "All test groups (A/B/C/HANDBACK/integration) passing"
      
  quality_score:
    type: integer
    minimum: 0
    maximum: 100
    description: "Validator-computed quality score (not self-reported)"
    calculated_from:
      - "Layer 1 (Format Gate): 40% weight"
      - "Layer 2 (Content Gate): 35% weight"
      - "Layer 3 (Quality Gate): 25% weight"
    acceptance_threshold:
      "90-100": "Accept immediately"
      "80-89": "Accept with notes"
      "70-79": "Manual review by Lead Engineer"
      "60-69": "Re-work triggered"
      "<60": "Escalate to Principal Engineer"
    example: 92
    
  effort_actual:
    type: number
    minimum: 0
    description: "Actual hours spent (may differ from estimated_hours)"
    example: 13.5
    
  tokens_in:
    type: integer
    minimum: 1
    description: "Input tokens used by model"
    example: 45230
    
  tokens_out:
    type: integer
    minimum: 1
    description: "Output tokens generated by model"
    example: 12847
    
  duration_minutes:
    type: integer
    minimum: 1
    description: "Wall-clock time from task start to completion"
    example: 180
    
  notes:
    type: string
    min_length: 5
    description: "≥5 words explaining outcome, decisions, and context"
    example: "Successfully implemented all Week 1 validation components: 5 YAML schemas with 18 validation checks, pre-flight function with Groups A/B/C, retry tracking with escalation, pre-commit hook, and 25 comprehensive unit tests. All tests passing with 95% coverage. Ready for Week 2 routing and metrics work."

subtask_fields:
  children_created:
    type: array
    optional: true
    items:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
    description: "List of child task IDs created by this task during execution"
    validation:
      - "Count should match number of sub-tasks actually queued"
    example:
      - "2026-05-13-arch-service-a"
      - "2026-05-13-arch-service-b"
      - "2026-05-13-arch-service-c"

  children_results:
    type: object
    optional: true
    description: "Aggregated results from all child tasks (keyed by child task_id)"
    additionalProperties:
      type: object
      required: ["status", "output", "quality"]
      properties:
        status:
          type: string
          enum: [complete, failed, partial, blocked]
        output:
          type: any
          description: "Child task output payload"
        quality:
          type: number
          minimum: 0
          maximum: 100
          description: "Child task quality score"
    validation:
      - "Populated only when all children have completed (or timed out)"
    example:
      "2026-05-13-arch-service-a":
        status: complete
        output: {bottlenecks: [], recommendations: []}
        quality: 92

  children_failed:
    type: array
    optional: true
    items:
      type: string
    description: "Child task IDs that failed (status=failed or status=blocked)"
    example:
      - "2026-05-13-arch-service-b"

  result_aggregation_status:
    type: string
    optional: true
    enum:
      - all_complete     # All children finished successfully
      - partial          # Some children failed but parent continues
      - timed_out        # Children did not complete within timeout
    description: "Reflects completion state of child task aggregation"
    example: "all_complete"

optional_fields:
  summary:
    type: string
    description: "1-2 sentence executive summary of work completed"
    example: "Implemented comprehensive pre-flight validation system enforcing protocol compliance. All success criteria met, 25/25 tests passing, 95% code coverage."
    
  quality_breakdown:
    type: object
    description: "Breakdown of quality score by layer"
    properties:
      layer_1_format:
        type: integer
        minimum: 0
        maximum: 100
        description: "Format Gate score (40% weight)"
        
      layer_2_content:
        type: integer
        minimum: 0
        maximum: 100
        description: "Content Gate score (35% weight)"
        
      layer_3_quality:
        type: integer
        minimum: 0
        maximum: 100
        description: "Quality Gate score (25% weight)"
    example:
      layer_1_format: 95
      layer_2_content: 92
      layer_3_quality: 88
      
  blockers:
    type: array
    items:
      type: string
    description: "Issues that prevented completion (if status != complete)"
    example:
      - "Ambiguous requirement in B1 criteria interpretation"
      - "Missing reference to orchestrator.py line 520"
      
  warnings:
    type: array
    items:
      type: string
    description: "Non-blocking issues or tech debt"
    example:
      - "Pre-commit hook requires bash, not portable to Windows"
      - "YAML schema validation requires PyYAML library"
      
  qe_feedback:
    type: object
    description: "Quality Engineer review feedback (populated post-completion)"
    properties:
      reviewed:
        type: boolean
        
      reviewer_notes:
        type: string
        
      improvements:
        type: array
        items:
          type: string
        description: "Suggestions for improvement"
        
      approve:
        type: boolean
        
    example:
      reviewed: true
      reviewer_notes: "Excellent implementation. All requirements met. Code is clean, well-documented, and follows conventions."
      improvements:
        - "Consider adding logging to validation function for debugging"
      approve: true
      
  retry_context:
    type: object
    description: "Context for re-DELEGATE if task will be retried"
    properties:
      retry_count:
        type: integer
        minimum: 1
        description: "Which retry this is (1 = first retry)"
        
      previous_score:
        type: integer
        description: "Quality score from previous attempt"
        
      failure_reasons:
        type: array
        items:
          type: string
        description: "Specific reasons for re-work"
        
      improvement_guidance:
        type: string
        description: "What specifically needs to be improved"
        
    example:
      retry_count: 1
      previous_score: 65
      failure_reasons:
        - "B2: Only 3 test cases, need 7 for high-effort task"
        - "B3: Pre-commit hook not executable"
      improvement_guidance: "Add missing test cases for Groups B/C. Ensure all new files are executable. Verify hook runs successfully in CI/CD."

# Validation Layers (enforced by quality_validator.py)
validation_layers:
  
  layer_1:
    name: "Format Gate (Structural Integrity)"
    weight: 40
    pass_threshold: 60
    description: "Validates structural integrity of HANDBACK before any content review"
    checks:
      - field: "handoff_type"
        requirement: "Must equal 'HANDBACK'"
        severity: "CRITICAL"
        penalty: -25
        
      - field: "task_id"
        requirement: "Must exactly match DELEGATE task_id"
        severity: "CRITICAL"
        penalty: -25
        
      - field: "status"
        requirement: "One of: complete, failed, partial, blocked"
        severity: "ERROR"
        penalty: -15
        
      - field: "deliverables"
        requirement: "Required for effort≥high"
        severity: "ERROR"
        penalty: -10
        
      - field: "tests"
        requirement: "Required for engineer-tier roles"
        severity: "ERROR"
        penalty: -10
        
      - field: "notes"
        requirement: "≥5 words, explains outcome"
        severity: "ERROR"
        penalty: -10
        
      - field: "tokens_in"
        requirement: "Present and positive integer"
        severity: "WARNING"
        penalty: -5
        
      - field: "tokens_out"
        requirement: "Present and positive integer"
        severity: "WARNING"
        penalty: -5
        
      - field: "duration_minutes"
        requirement: "Present and positive"
        severity: "WARNING"
        penalty: -5
        
  layer_2:
    name: "Content Gate (Task Quality)"
    weight: 35
    pass_threshold: 70
    description: "Verifies task quality against original DELEGATE success_criteria"
    checks:
      - criterion: "All plan steps executed"
        requirement: "Each plan step maps to deliverable or documented deviation"
        weight: 30
        measurement: "manual review or checklist"
        
      - criterion: "Success criteria addressed"
        requirement: "Every criterion from DELEGATE referenced in HANDBACK"
        weight: 40
        measurement: "cross-reference DELEGATE vs HANDBACK"
        
      - criterion: "Tests pass"
        requirement: "tests.failed == 0 and test count maintained or increased"
        weight: 20
        measurement: "automated check"
        
      - criterion: "No scope creep"
        requirement: "Deliverables within DELEGATE scope only"
        weight: 10
        measurement: "manual review"
        
  layer_3:
    name: "Quality Gate (Post-completion)"
    weight: 25
    pass_threshold: 80
    description: "Validates overall quality and production readiness"
    checks:
      - criterion: "Composite quality score"
        requirement: "≥80/100 for acceptance without review"
        source: "quality_validator.py composite"
        
      - criterion: "Test coverage"
        requirement: "≥70% for modified packages"
        source: "tests.coverage field"
        
      - criterion: "Production hazards"
        requirement: "Zero new panic, hardcoded secrets, commented-out code"
        source: "Tier 1 checklist (QUALITY.md)"
        
      - criterion: "QE feedback"
        requirement: "qe_feedback block present on completed tasks"
        source: "QUALITY.md QE Feedback section"
        
      - criterion: "Deliverables exist"
        requirement: "All files in deliverables field exist on disk"
        source: "Automated spot-check"

# HANDBACK Acceptance Decision Matrix
acceptance_decisions:
  "90-100":
    decision: "ACCEPT (automated)"
    escalation: "None"
    description: "Excellent quality, no manual review needed"
    
  "80-89":
    decision: "ACCEPT (automated)"
    escalation: "None"
    description: "Good quality, accept with notes"
    
  "70-79":
    decision: "MANUAL_REVIEW"
    escalation: "Lead Engineer"
    description: "Gray zone - Lead Engineer decides accept or re-work"
    
  "60-69":
    decision: "RE-WORK"
    escalation: "Auto-retry (max 2)"
    description: "Specific criteria not met, re-DELEGATE with guidance"
    
  "<60":
    decision: "ESCALATE"
    escalation: "Principal Engineer"
    description: "Major issues, escalate for triage/redesign"
    
  "critical_finding":
    decision: "ESCALATE"
    escalation: "Principal Engineer"
    description: "Security issue, architecture problem, or data loss risk"

# Self-Reported vs Computed Score Policy
score_policy:
  authoritative_source: "validator-computed score (from quality_validator.py)"
  agent_self_reported: "recorded in metrics as 'agent_self_score' for calibration only"
  rationale: "Prevents inflation; ensures independent assessment"
  routing_basis: "validator score exclusively"

# Token Budget & Cost Tracking
token_tracking:
  fields:
    - "tokens_in"
    - "tokens_out"
    - "total_tokens: tokens_in + tokens_out"
  cost_per_million:
    "claude-haiku-4.5": "$0.80 input, $4.00 output"
    "claude-sonnet-4.6": "$3.00 input, $15.00 output"
    "claude-opus-4.7": "$15.00 input, $75.00 output"
  metrics_aggregation:
    destination: "metrics/cost-quality-analysis.json"
    frequency: "per-task"
    purpose: "Cost-quality tradeoff analysis by role and task type"

# Deliverables Validation
deliverables_validation:
  must_exist: true
  must_be_readable: true
  spot_check: "Layer 3 automated validation"
  example_validations:
    - "File not deleted between submission and validation"
    - "File permissions correct (e.g., hooks executable)"
    - "File content matches description (grep check)"
