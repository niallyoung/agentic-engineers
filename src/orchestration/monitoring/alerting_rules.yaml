groups:
  - name: agentic_engineers_orchestrator
    interval: 30s
    rules:

      # -----------------------------------------------------------------------
      # Error Rate Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighErrorRate
        expr: |
          rate(orchestrator_errors_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Orchestrator error rate is critically high (> 5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook_url: "docs/runbooks/high-error-rate.md"

      - alert: OrchestratorElevatedErrorRate
        expr: |
          rate(orchestrator_errors_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.01
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Orchestrator error rate elevated (> 1%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook_url: "docs/runbooks/high-error-rate.md"

      # -----------------------------------------------------------------------
      # Queue Depth Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorQueueDepthHigh
        expr: orchestrator_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Orchestrator queue depth is high (> 100)"
          description: "Queue depth is {{ $value }} tasks."
          runbook_url: "docs/runbooks/queue-depth-high.md"

      - alert: OrchestratorQueueDepthCritical
        expr: orchestrator_queue_depth > 500
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Orchestrator queue critically overloaded (> 500)"
          description: "Queue depth is {{ $value }} tasks — system may be overloaded."
          runbook_url: "docs/runbooks/queue-depth-high.md"

      # -----------------------------------------------------------------------
      # Quality Score Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorLowQualityScore
        expr: |
          orchestrator_quality_score_sum / orchestrator_quality_score_count < 70
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Average task quality score below 70"
          description: "Average quality score is {{ $value }}."
          runbook_url: "docs/runbooks/low-quality-score.md"

      # -----------------------------------------------------------------------
      # Task Duration Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighTaskLatency
        expr: |
          histogram_quantile(0.95, rate(orchestrator_task_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P95 task duration exceeds 300 seconds"
          description: "P95 task duration is {{ $value }}s."
          runbook_url: "docs/runbooks/high-task-latency.md"

      # -----------------------------------------------------------------------
      # Retry Rate Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighRetryRate
        expr: |
          rate(orchestrator_tasks_retried_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.20
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Task retry rate exceeds 20%"
          description: "Retry rate is {{ $value | humanizePercentage }}."
          runbook_url: "docs/runbooks/high-retry-rate.md"

      # -----------------------------------------------------------------------
      # Validation Error Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorValidationErrors
        expr: rate(orchestrator_validation_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Elevated DELEGATE/HANDBACK validation errors"
          description: "Validation error rate is {{ $value }}/s."
          runbook_url: "docs/runbooks/validation-errors.md"
