groups:
  - name: agentic_engineers_orchestrator
    interval: 30s
    rules:

      # -----------------------------------------------------------------------
      # Error Rate Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighErrorRate
        expr: |
          rate(orchestrator_errors_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Orchestrator error rate is critically high (> 5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook_url: "docs/runbooks/high-error-rate.md"

      - alert: OrchestratorElevatedErrorRate
        expr: |
          rate(orchestrator_errors_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.01
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Orchestrator error rate elevated (> 1%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook_url: "docs/runbooks/high-error-rate.md"

      # -----------------------------------------------------------------------
      # Queue Depth Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorQueueDepthHigh
        expr: orchestrator_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Orchestrator queue depth is high (> 100)"
          description: "Queue depth is {{ $value }} tasks."
          runbook_url: "docs/runbooks/queue-depth-high.md"

      - alert: OrchestratorQueueDepthCritical
        expr: orchestrator_queue_depth > 500
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Orchestrator queue critically overloaded (> 500)"
          description: "Queue depth is {{ $value }} tasks — system may be overloaded."
          runbook_url: "docs/runbooks/queue-depth-high.md"

      # -----------------------------------------------------------------------
      # Quality Score Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorLowQualityScore
        expr: |
          orchestrator_quality_score_sum / orchestrator_quality_score_count < 70
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Average task quality score below 70"
          description: "Average quality score is {{ $value }}."
          runbook_url: "docs/runbooks/low-quality-score.md"

      # -----------------------------------------------------------------------
      # Task Duration Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighTaskLatency
        expr: |
          histogram_quantile(0.95, rate(orchestrator_task_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P95 task duration exceeds 300 seconds"
          description: "P95 task duration is {{ $value }}s."
          runbook_url: "docs/runbooks/high-task-latency.md"

      # -----------------------------------------------------------------------
      # Retry Rate Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorHighRetryRate
        expr: |
          rate(orchestrator_tasks_retried_total[5m])
          / rate(orchestrator_tasks_total[5m]) > 0.20
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Task retry rate exceeds 20%"
          description: "Retry rate is {{ $value | humanizePercentage }}."
          runbook_url: "docs/runbooks/high-retry-rate.md"

      # -----------------------------------------------------------------------
      # Validation Error Alerts
      # -----------------------------------------------------------------------
      - alert: OrchestratorValidationErrors
        expr: rate(orchestrator_validation_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Elevated DELEGATE/HANDBACK validation errors"
          description: "Validation error rate is {{ $value }}/s."
          runbook_url: "docs/runbooks/validation-errors.md"

      # -----------------------------------------------------------------------
      # Token Cost Anomaly Alerts
      # -----------------------------------------------------------------------
      - alert: TokenCostDailyHigh
        expr: |
          increase(orchestrator_cost_usd_total[24h]) > 100
        for: 5m
        labels:
          severity: warning
          team: platform
          cost_anomaly: "true"
        annotations:
          summary: "Daily token cost exceeds $100"
          description: "Daily cost is ${{ $value | humanize }}. Review token usage patterns."
          runbook_url: "docs/runbooks/token-cost-high.md"

      - alert: TokenCostPerTaskHigh
        expr: |
          (increase(orchestrator_cost_usd_total[1h]) / rate(orchestrator_tasks_total[1h])) > 5
        for: 10m
        labels:
          severity: warning
          team: platform
          cost_anomaly: "true"
        annotations:
          summary: "Cost per task exceeds $5"
          description: "Average cost per task is ${{ $value | humanize }}. Investigate task complexity."
          runbook_url: "docs/runbooks/token-cost-high.md"

      - alert: TokenCacheHitRateLow
        expr: |
          (rate(orchestrator_tokens_cached_total[5m]) / 
           (rate(orchestrator_tokens_input_total[5m]) + rate(orchestrator_tokens_output_total[5m]))) < 0.5
        for: 15m
        labels:
          severity: warning
          team: platform
          cost_anomaly: "true"
        annotations:
          summary: "Token cache hit rate below 50%"
          description: "Cache effectiveness is {{ $value | humanizePercentage }}. Cache performance is degraded."
          runbook_url: "docs/runbooks/cache-hit-rate-low.md"

      - alert: TokenUsageAnomaly
        expr: |
          (abs(orchestrator_tokens_total - avg_over_time(orchestrator_tokens_total[7d])) 
           / stddev_over_time(orchestrator_tokens_total[7d])) > 2.5
        for: 5m
        labels:
          severity: warning
          team: platform
          cost_anomaly: "true"
        annotations:
          summary: "Token usage anomaly detected (> 2.5σ from mean)"
          description: "Current usage is {{ $value }}σ above normal. Investigate unusual patterns."
          runbook_url: "docs/runbooks/token-usage-anomaly.md"
