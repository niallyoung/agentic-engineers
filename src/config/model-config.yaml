---
# Model Configuration — Runtime Model Selection & Experimentation
# This file enables cost optimization, A/B testing, and dynamic model selection
# without code changes. Read at Orchestrator startup; can be hot-reloaded.
#
# Precedence (highest to lowest):
# 1. Experiment (if task matches experiment.selector)
# 2. Task-type override (if task_type matches)
# 3. Agent override (if agent role matches)
# 4. Global default

# ==============================================================================
# GLOBAL DEFAULTS
# ==============================================================================
global:
  # Fallback model for any agent not explicitly configured
  default_model: "claude-haiku-4.5"
  # Enable hot-reload without restart (check every N seconds; 0 = disabled)
  reload_interval_seconds: 0
  # Log model selection decisions (for debugging)
  debug_mode: false

# ==============================================================================
# PER-AGENT OVERRIDES
# Map: agent role → model assignment (overrides global default)
# ==============================================================================
agents:
  orchestrator:
    model: "claude-haiku-4.5"
    notes: "Cheap routing; route to specialists"

  engineer:
    model: "claude-haiku-4.5"
    notes: "Execution specialist; well-scoped tasks"

  quality_engineer:
    model: "claude-sonnet-5"
    notes: "Post-implementation validation"

  senior_engineer:
    model: "claude-sonnet-5"
    notes: "Complex, unscoped work; analysis & planning"

  lead_engineer:
    model: "claude-sonnet-5"
    notes: "Code review & architecture guidance"

  principal_engineer:
    model: "claude-opus-5"
    notes: "Cross-service architecture; design decisions"

  security_engineer:
    model: "claude-fable-5"
    notes: "Security analysis; threat modeling; final escalation (unconditional default; claude-opus-5 is emergency fallback only)"

  model_engineer:
    model: "claude-sonnet-5"
    notes: "Cost/quality optimization analysis"

# ==============================================================================
# PER-TASK-TYPE OVERRIDES
# Map: task_type → model assignment (overrides agent & global)
# Useful for cost optimization or quality tuning on specific task patterns
# ==============================================================================
tasks:
  # High-complexity tasks benefit from the best model despite normal agent tier
  security_audit:
    model: "claude-fable-5"
    notes: "Security audits always use the unconditional-default security model"

  threat_modeling:
    model: "claude-fable-5"
    notes: "Threat modeling requires best-in-class reasoning"

  architecture_review:
    model: "claude-opus-5"
    notes: "Cross-service architecture design"

  # Documentation tasks can use cheaper models
  documentation:
    model: "claude-haiku-4.5"
    notes: "Documentation generation is lower-complexity"

  # Code reviews benefit from Sonnet but not always Opus
  code_review:
    model: "claude-sonnet-5"
    notes: "Code review — balanced quality/cost"

  # Testing and testing infrastructure
  test_implementation:
    model: "claude-haiku-4.5"
    notes: "Test code generation — simpler than feature code"

  test_validation:
    model: "claude-sonnet-5"
    notes: "Test validation and test suite review"

# ==============================================================================
# EXPERIMENTS (A/B Testing)
# Enables cost optimization, model upgrade validation, routing experiments
# ==============================================================================
experiments:
  # Example: Cost optimization experiment
  # Routes 50% of engineer tasks to Haiku (cheap), 50% to Sonnet (quality validation)
  experiment_2026_06_13_haiku_vs_sonnet:
    enabled: true
    name: "Haiku vs Sonnet: Engineer Efficiency"
    description: "Measure Haiku cost savings vs Sonnet quality on engineer tasks"

    # Selector: which tasks match this experiment
    selector:
      agent: "engineer"
      task_types: ["implementation", "refactoring"]  # only these task types
      min_complexity: 0  # applies to all complexity levels
      min_scope_words: 50  # only scopes ≥50 words

    # Traffic allocation: variant_name → traffic_percentage (must sum to 100)
    variants:
      control:
        traffic_allocation: 50
        model: "claude-haiku-4.5"
        notes: "Control: current baseline (Haiku)"

      variant_a:
        traffic_allocation: 50
        model: "claude-sonnet-4.5"
        notes: "Variant A: upgraded to Sonnet for quality validation"

    # Duration and stopping criteria
    start_date: "2026-06-13"
    end_date: "2026-06-30"
    early_stop_threshold: 0.85  # stop early if quality delta > 15%, cost delta < 30%
    notes: "Early stopping on: quality parity achieved + cost savings >20%"

  # Example: Model upgrade validation
  # Validates new Opus 4.8 model on Principal Engineer tasks
  experiment_2026_06_15_opus_4_8_validation:
    enabled: false
    name: "Opus 4.8 Validation on Principal Engineer"
    description: "Validate claude-opus-4.8 for principal engineer tasks"

    selector:
      agent: "principal_engineer"
      task_types: []  # all task types
      min_complexity: 0
      min_scope_words: 100

    variants:
      control:
        traffic_allocation: 80
        model: "claude-opus-4.6"
        notes: "Control: current (Opus 4.6)"

      variant_a:
        traffic_allocation: 20
        model: "claude-opus-4.8"
        notes: "Variant A: new model (Opus 4.8)"

    start_date: "2026-06-15"
    end_date: "2026-06-30"
    early_stop_threshold: 0.80
    notes: "Quality parity + <10% cost increase acceptable"

# ==============================================================================
# PROVIDER SELECTION (Future: Multi-Provider Support)
# When available, enables fallback to other providers if preferred unavailable
# ==============================================================================
provider_preference:
  # Default provider preference order
  primary: "anthropic"        # Anthropic Claude (preferred)
  fallback: ["openai", "google", "ollama"]  # fallback chain

  # Provider-specific model mappings (for cross-provider substitution)
  # maps canonical role → provider-specific model
  provider_models:
    anthropic:
      engineer: "claude-haiku-4.5"
      senior_engineer: "claude-sonnet-5"
      principal_engineer: "claude-opus-5"

    openai:
      engineer: "gpt-4o-mini"
      senior_engineer: "gpt-4-turbo"
      principal_engineer: "gpt-4o"

    google:
      engineer: "gemini-2.0-flash"
      senior_engineer: "gemini-1.5-pro"
      principal_engineer: "gemini-1.5-pro"

    ollama:
      engineer: "llama-3-8b"
      senior_engineer: "llama-3-70b"
      principal_engineer: "llama-3-70b"

# ==============================================================================
# COST CONSTRAINTS (Optional: Per-Task Model Limits)
# Enforce cost ceiling per task without changing logic
# ==============================================================================
cost_limits:
  enabled: false

  # Per-task max cost (USD)
  max_cost_per_task: 0.50

  # If max_cost_per_task exceeded, downgrade to cheaper model
  downgrade_on_exceed: true

  # Model tiers (sorted by cost)
  cost_tiers:
    - "claude-haiku-4.5"
    - "claude-sonnet-5"
    - "claude-opus-5"
    - "claude-fable-5"

# ==============================================================================
# SCHEMA DOCUMENTATION
# ==============================================================================
# agents.<role>.model — string, required
#   Model name (canonical format with dots: claude-{variant}-{major}.{minor})
#
# tasks.<task_type>.model — string, required
#   Model name for task type (overrides agent model)
#
# experiments.<exp_id>.selector — object
#   agent: role name (e.g., "engineer")
#   task_types: [list of task types] (empty = all)
#   min_complexity: 0-10 scale (0 = applies to all)
#   min_scope_words: minimum scope word count (0 = applies to all)
#
# experiments.<exp_id>.variants.<variant_name> — object
#   traffic_allocation: integer 0-100 (sum must equal 100 across all variants)
#   model: model name
#   notes: human-readable description
