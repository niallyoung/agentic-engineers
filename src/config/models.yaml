  general_orchestrator:
    canonical: "claude-haiku"
    thinking: false
    effort: "low"
    providers:
      copilot: "gpt-4o-mini"
      claude: "claude-haiku-4.5"
      openai: "gpt-4o-mini"
      google: "gemini-2.0-flash"
      meta: "llama-3-8b"
