# Provider capabilities (LCD - highlight deltas)
provider_features:
  copilot:
    name: "GitHub Copilot"
    thinking: false  # ⚠️ Delta: Copilot doesn't support extended thinking
    structured_output: true
    max_tokens: 4096
    cost_tier: "premium"
    note: "Uses OpenAI models, no thinking mode"

  claude:
    name: "Claude (Anthropic)"
    thinking: true
    structured_output: true
    max_tokens: 200000
    cost_tier: "premium"
    note: "Native thinking support, longest context"

  openai:
    name: "OpenAI API"
    thinking: false  # ⚠️ Delta: Limited thinking in GPT-4o
    structured_output: true
    max_tokens: 128000
    cost_tier: "premium"
    note: "GPT-4o has limited reasoning"

  google:
    name: "Google Gemini"
    thinking: false  # ⚠️ Delta: Gemini doesn't support extended thinking
    structured_output: true
    max_tokens: 1000000
    cost_tier: "standard"
    note: "Longest context window"

  meta:
    name: "Meta Llama"
    thinking: false  # ⚠️ Delta: Llama doesn't support structured outputs
    structured_output: false
    max_tokens: 128000
    cost_tier: "budget"
    note: "Open-source, no structured output guarantee"
