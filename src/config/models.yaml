---
# CANONICAL MODEL REGISTRY - Single Source of Truth
# Maps roles to models across all providers
# Used by render pipeline to substitute provider-specific model names

role_models:
  engineer:
    canonical: "claude-haiku"
    thinking: false
    effort: "high"
    providers:
      copilot: "gpt-4o-mini"
      claude: "claude-haiku-4.5"
      openai: "gpt-4o-mini"
      google: "gemini-2.0-flash"
      meta: "llama-3-8b"
    description: "Execution specialist - well-scoped, planned work"

  senior_engineer:
    canonical: "claude-sonnet"
    thinking: true
    effort: "high"
    providers:
      copilot: "gpt-4"
      claude: "claude-sonnet-4.6"
      openai: "gpt-4-turbo"
      google: "gemini-1-5-pro"
      meta: "llama-3-70b"
