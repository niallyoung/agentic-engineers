    created: "2026-04-24"
    last_deployed: "2026-05-24"

  orchestrator:
    name: Orchestrator
    model: claude-haiku-4.5
    type: routing
    status: active
    effort: low
    description: "All entry points; routing decisions; task management; metrics collection"
    created: "2026-01-15"
    last_deployed: "2026-05-24"

  principal-engineer:
    name: Principal Engineer
    model: claude-opus-4.7
    type: architecture
    status: active
    effort: high
