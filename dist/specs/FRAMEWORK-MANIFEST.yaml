    created: "2026-01-15"
    last_deployed: "2026-05-24"

  quality-engineer:
    name: Quality Engineer
    model: claude-sonnet-4.6
    type: validation
    status: active
    effort: medium
    description: "Post-implementation quality gate; code review; model suitability assessment"
    created: "2026-01-15"
    last_deployed: "2026-05-24"

  security-engineer:
    name: Security Engineer
    model: claude-opus-4.7
    type: security
    status: active
