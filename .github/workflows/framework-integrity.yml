---
name: Framework Integrity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  framework-gates:
    name: Framework Consistency Gates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install pyyaml pytest
      
      # render-all MUST run before the consistency gates: several of them
      # (e.g. test_copilot_rendered_agents_end_with_agent_agent_md) pytest.skip
      # when dist/ is absent, so running them first silently disabled them.
      - name: Generate dist/ outputs (prerequisite for both gate suites)
        id: render
        run: |
          make render-all

      - name: Run framework consistency gates
        id: consistency
        run: |
          python3 -m pytest tests/test_framework_consistency.py -v

      - name: Run render pipeline validation
        id: render_pipeline
        run: |
          python3 -m pytest tests/test_render_pipeline.py -v

      # Derived from real step outcomes. The previous version printed six
      # hard-coded "✅ Gate N" lines under if: always(), so the job summary
      # claimed all-green even when the pytest step had failed.
      - name: Generate framework status report
        if: always()
        run: |
          icon() {
            case "$1" in
              success) echo "✅ success" ;;
              skipped) echo "⏭️ skipped" ;;
              "")      echo "⚪ did not run" ;;
              *)       echo "❌ $1" ;;
            esac
          }
          {
            echo "## Framework Status Report"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Render dist/ outputs | $(icon '${{ steps.render.outcome }}') |"
            echo "| Framework consistency gates | $(icon '${{ steps.consistency.outcome }}') |"
            echo "| Render pipeline validation | $(icon '${{ steps.render_pipeline.outcome }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Report summary
        if: success()
        run: |
          echo "✅ All framework consistency gates passed"
      
      - name: Report failure
        if: failure()
        run: |
          echo "❌ Framework consistency gates failed - see details above"
          exit 1

  # workflow-quality-gate job removed (SPEC-2026-005 framework slimdown, WP-0,
  # 2026-08-11): it importlib-exec'd src/skills/workflow-review/scripts/
  # workflow_review.py, which is deleted along with the workflow-review skill
  # in a later WP (workflow-review is not one of the 8 surviving skills — see
  # principal-engineer HANDBACK task-2026-08-11-framework-slimdown-design).
  # Design verdict: this gate only ever blocked on a hard crash of the script,
  # never on the quality_score itself (Block merge on failure only fires on
  # `failure()`, i.e. an exception, not a low score) — negative value, safe
  # to drop rather than reimplement.
