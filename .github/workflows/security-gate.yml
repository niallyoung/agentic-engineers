name: Security Gate

on:
  pull_request:
    branches: [main, develop, feature/*]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-checks:
    name: Security Pre-Merge Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          pip install -e .

      - name: Entropy-based credential scanning
        run: |
          python3 << 'EOF'
          import sys
          from collections import Counter
          from scripts.entropy_detector import EntropyDetector
          from pathlib import Path

          detector = EntropyDetector()
          findings = []

          # Scan the whole repo, not just src/**/*.py. Secrets land in YAML,
          # JSON, .env and config far more often than in Python source.
          # scan_directory() filters by extension and skips vendored/build dirs.
          for root in ['src', 'renderer', 'scripts', '.github', 'docs', 'tests', 'config']:
              path = Path(root)
              if path.is_dir():
                  findings.extend(detector.scan_directory(path))

          # Top-level config/dotfiles that live outside those directories.
          for path in Path('.').glob('*'):
              if path.is_file() and detector.should_scan(path):
                  findings.extend(detector.scan_file(path))

          if findings:
              max_sev = detector.max_severity(findings)
              by_sev = Counter(f.get('severity', 'MEDIUM') for f in findings)
              print(f"::error::Credentials detected — {len(findings)} finding(s), max severity {max_sev}")
              print(f"Breakdown: {dict(by_sev)}")
              for f in findings[:25]:
                  print(f"  [{f.get('severity')}] {f['file']}:{f.get('line', '?')}: {f['reason']}")
              if len(findings) > 25:
                  print(f"  ... and {len(findings) - 25} more")
              print("")
              print("If a finding is a deliberate test fixture or documentation example,")
              print("append '# pragma: allowlist secret' to that line.")
              print("Otherwise: rotate the credential immediately, then remove it from history.")
              sys.exit(1)
          else:
              print("✅ Security: No credentials detected")
          EOF

      - name: SPEC.md compliance check
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          # Check the canonical spec exists with its key sections.
          # Canonical spec is docs/SPEC.md (root SPEC.md is a pointer since CU-5).
          spec_file = Path('docs/SPEC.md')
          if not spec_file.exists():
              print("❌ Security: SPEC.md not found")
              exit(1)
          
          # Verify key sections exist
          content = spec_file.read_text()
          required_sections = [
              '# Agentic Engineers Implementation Specification',
              'ORCHESTRATOR-FIRST EXECUTION MODEL',
          ]
          
          missing = [s for s in required_sections if s not in content]
          if missing:
              print(f"❌ Security: Missing docs/SPEC.md sections: {missing}")
              exit(1)
          
          print("✅ Security: SPEC.md compliance verified")
          EOF

      # Was `safety check --json || true`: `safety check` is deprecated in
      # safety 3.x (superseded by `safety scan`) and the `|| true` meant the
      # step could never fail, so it was decorative. pip-audit is a real gate.
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --progress-spinner=off \
            || { echo "::error::Vulnerable dependencies detected — upgrade the pinned versions above, or add an explicit --ignore-vuln with a justification."; exit 1; }

      - name: YAML schema validation
        run: |
          python3 << 'EOF'
          import yaml
          from pathlib import Path

          # docs/specs/protocol-core-v1.0.yaml is the single normative
          # DELEGATE/HANDBACK schema (see its header comment for the
          # precedence chain). Its skill-local copy must stay byte-identical
          # — that invariant is asserted by
          # tests/test_protocol_schema_copy_identity.py, not here; this gate
          # only confirms both files still parse as valid YAML.
          yaml_files = [
              'docs/specs/protocol-core-v1.0.yaml',
              'src/skills/protocol-validator/schema/protocol-core-v1.0.yaml',
          ]

          for yml_file in yaml_files:
              try:
                  Path(yml_file).read_text()
                  yaml.safe_load(Path(yml_file).read_text())
              except Exception as e:
                  print(f"❌ Invalid YAML in {yml_file}: {e}")
                  exit(1)

          print("✅ Security: All YAML schemas valid")
          EOF

      - name: Security test execution
        run: |
          python3 -m pytest tests/test_security_core.py -v --tb=short

      - name: Report security status
        if: success()
        run: |
          echo "✅ All security pre-merge checks passed"
          echo "- Credential scanning: PASS"
          echo "- SPEC.md compliance: PASS"
          echo "- YAML validation: PASS"
          echo "- Security tests: PASS"

      - name: Report security failures
        if: failure()
        run: |
          echo "❌ Security pre-merge checks FAILED"
          echo "Please address security issues before merging"
          exit 1
