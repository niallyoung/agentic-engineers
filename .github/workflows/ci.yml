name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve symlinks
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
          pip install -e .

      - name: Install git hooks
        run: |
          mkdir -p .git/hooks
          # Copy custom hooks from .githooks to .git/hooks
          for hook in pre-commit commit-msg post-merge pre-push; do
            if [ -f ".githooks/$hook" ]; then
              cp ".githooks/$hook" ".git/hooks/$hook"
              chmod +x ".git/hooks/$hook"
            fi
          done
          echo "Git hooks installed:"
          ls -lh .git/hooks/{pre-commit,commit-msg,post-merge,pre-push} 2>/dev/null || echo "Some hooks missing"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Verify
        run: make verify

  tag:
    name: Tag Release
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve symlinks
        run: git config --global core.symlinks true

      - name: Bump version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v
          default_bump_to_version: "0.8.0"

      - name: Create Release Summary
        run: |
          echo "### Release: ${{ steps.tag.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Previous:** ${{ steps.tag.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changelog:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tag.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY
