name: CI

on:
  push:
    branches: '**'
    tags:
      - 'v*'
  pull_request:
    branches: '**'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve symlinks
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
          pip install -e .

      - name: Install git hooks
        run: |
          # Configure git to use .githooks directory for hooks
          git config core.hooksPath .githooks
          mkdir -p .git/hooks
          # Copy custom hooks from .githooks to .git/hooks for fallback
          for hook in pre-commit commit-msg post-merge pre-push; do
            if [ -f ".githooks/$hook" ]; then
              cp ".githooks/$hook" ".git/hooks/$hook"
              chmod +x ".git/hooks/$hook"
            fi
          done
          # Copy hook dependencies (e.g., LOCKED_MODELS.sh sourced by pre-commit)
          for dep in LOCKED_MODELS.sh LOCKED_MODELS_RATIONALE.md; do
            if [ -f ".githooks/$dep" ]; then
              cp ".githooks/$dep" ".git/hooks/$dep"
            fi
          done
          echo "Git hooks configured:"
          git config core.hooksPath
          ls -lh .git/hooks/{pre-commit,commit-msg,post-merge,pre-push} 2>/dev/null || echo "Some hooks missing"

      - name: Credential scan (no tokens in tree or gitconfig)
        run: |
          # Defense-in-depth against the token-in-gitconfig incident class.
          # 1. Fail if any committed file contains a real token signature.
          if git grep -nIE 'x-access-token|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|https://[^/@[:space:]]+:[^/@[:space:]]+@github' \
               -- ':!*test*' ':!*Test*' ':!scripts/check-gitconfig-no-tokens.sh' ':!docs/**' ':!*.md' ':!scripts/validate_opencode_config.py' ':!.github/workflows/ci.yml'; then
            echo "::error::Embedded token/credential pattern found in tracked files"
            exit 1
          fi
          # 2. Fail if the runner's gitconfig has an embedded token.
          scripts/check-gitconfig-no-tokens.sh

      - name: Lint
        run: make lint

      # ── Skill/render gates ───────────────────────────────────────────────

      - name: "Gate 1: SKILL.md frontmatter + registry + compliance"
        # renderer/validate_skills.py validates every SKILL.md's frontmatter
        # and registry completeness, plus a deeper ACTIVE_SKILLS compliance
        # audit (required metadata, directory structure, ## Self-Improvement
        # section). Single implementation as of the 2026-08-13 infra
        # consolidation (formerly split across scripts/ and renderer/).
        # Warnings are reported but do not fail CI; only errors fail the build.
        run: |
          python renderer/validate_skills.py
          echo "::notice::Run 'python renderer/validate_skills.py --strict' locally to see warnings"

      - name: "Gate 2: Skill template conformance report"
        # Generate a non-failing annotated report for the PR review audit trail.
        # The report is emitted as a GitHub step summary for visibility.
        run: python renderer/validate_skills.py --json | python scripts/format_skill_report.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: "Gate 3: Orphaned bytecode check"
        # Folded in from the former validate-sources.yml (2026-08-13 infra
        # consolidation) — fails if any .pyc is tracked in git or if
        # __pycache__ contains bytecode with no corresponding source file.
        run: |
          ORPHANED=0
          while IFS= read -r pyc_file; do
            [ -n "$pyc_file" ] || continue
            echo "::error::.pyc file tracked in git (should be gitignored): $pyc_file"
            ORPHANED=$((ORPHANED + 1))
          done < <(git ls-files '*.pyc' 2>/dev/null || true)
          while IFS= read -r pyc_dir; do
            [ -n "$pyc_dir" ] || continue
            parent_dir=$(dirname "$pyc_dir")
            for pyc in $(find "$pyc_dir" -name "*.pyc" 2>/dev/null); do
              base_name=$(basename "$pyc" | sed 's/\.cpython-.*\.pyc/.py/')
              py_path="$parent_dir/$base_name"
              if [ ! -f "$py_path" ] && ! git ls-files "$py_path" > /dev/null 2>&1; then
                echo "::error::Orphaned bytecode without source: $pyc (expected $py_path)"
                ORPHANED=$((ORPHANED + 1))
              fi
            done
          done < <(find . -type d -name __pycache__ -not -path "*/.git/*" 2>/dev/null)
          if [ "$ORPHANED" -gt 0 ]; then
            echo "::error::Found $ORPHANED orphaned bytecode issue(s)"
            exit 1
          fi
          echo "✅ No orphaned bytecode found"

      # ─────────────────────────────────────────────────────────────────────

      - name: Render agents and skills
        run: |
          make render-copilot
          make render-claude
          make render-opencode
          make render-codex
          make render-specs

      - name: Test
        run: make test

      - name: "Gate 4: Harness regression check"
        # Floor re-baselined periodically from the measured actual (see
        # renderer/scripts/check_test_regression.py header for history).
        # Update baselines only via SPEC change + QE sign-off (see docs/REGRESSION-GATE-POLICY.md).
        run: python renderer/scripts/check_test_regression.py

      - name: "Gate 5 (stub): AAIF AGENTS.md v1.0 conformance"
        # AAIF's public roadmap lists "AGENTS.md v1.0 — first stable behavioral
        # spec" with planned goose-based validation tooling, but as of this
        # writing (2026-08-14) agentsmd/agents.md has never cut a release
        # (github.com/agentsmd/agents.md/releases is empty) and no validator
        # CLI has shipped — see docs/RENDERING.md "AGENTS.md v1.0 readiness"
        # for citations. This step is a forward-looking stub only: it probes
        # for a `goose` binary with an `agents-md validate` subcommand and
        # runs it against src/AGENTS.md if found, else prints a dated skip
        # notice. It must NEVER fail the build while the tooling is
        # unreleased — flip to a hard gate once AAIF ships v1.0 tooling.
        run: |
          if command -v goose >/dev/null 2>&1 && goose agents-md validate --help >/dev/null 2>&1; then
            echo "::notice::goose AGENTS.md validator detected — running against src/AGENTS.md"
            goose agents-md validate src/AGENTS.md || echo "::warning::AAIF validator reported issues (non-blocking pending v1.0 GA)"
          else
            echo "::notice::[2026-08-14] AAIF AGENTS.md v1.0 validation tooling not yet released (no agentsmd/agents.md GitHub release, no goose validator subcommand found). Skipping — see AAIF roadmap at https://aaif.io and docs/RENDERING.md. This step will activate automatically once a 'goose' binary exposing 'agents-md validate' is on PATH."
          fi

      - name: Verify
        run: make verify

  auto-tag:
    name: Auto-Tag (Semantic Versioning)
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create semantic version tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          default_prerelease_bump: prerelease
          release_branches: main
          custom_release_rules: "feat:minor:✨ Features,fix:patch:🐛 Bug Fixes,docs:patch:📚 Documentation,chore:patch:🔧 Chores,refactor:patch:♻️ Refactoring,perf:patch:⚡ Performance,security:patch:🔒 Security"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
