name: CI

on:
  push:
    branches: '**'
    tags:
      - 'v*'
  pull_request:
    branches: '**'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve symlinks
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
          pip install -e .

      - name: Install git hooks
        run: |
          # Configure git to use .githooks directory for hooks
          git config core.hooksPath .githooks
          mkdir -p .git/hooks
          # Copy custom hooks from .githooks to .git/hooks for fallback
          for hook in pre-commit commit-msg post-merge pre-push; do
            if [ -f ".githooks/$hook" ]; then
              cp ".githooks/$hook" ".git/hooks/$hook"
              chmod +x ".git/hooks/$hook"
            fi
          done
          # Copy hook dependencies (e.g., LOCKED_MODELS.sh sourced by pre-commit)
          for dep in LOCKED_MODELS.sh LOCKED_MODELS_RATIONALE.md PRE-PUSH.md; do
            if [ -f ".githooks/$dep" ]; then
              cp ".githooks/$dep" ".git/hooks/$dep"
            fi
          done
          echo "Git hooks configured:"
          git config core.hooksPath
          ls -lh .git/hooks/{pre-commit,commit-msg,post-merge,pre-push} 2>/dev/null || echo "Some hooks missing"

      - name: Credential scan (no tokens in tree or gitconfig)
        run: |
          # Defense-in-depth against the token-in-gitconfig incident class.
          # 1. Fail if any committed file contains a real token signature.
          if git grep -nIE 'x-access-token|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|https://[^/@[:space:]]+:[^/@[:space:]]+@github' \
               -- ':!*test*' ':!*Test*' ':!scripts/check-gitconfig-no-tokens.sh' ':!docs/**' ':!*.md' ':!src/opencode/config_validator.py' ':!.github/workflows/ci.yml'; then
            echo "::error::Embedded token/credential pattern found in tracked files"
            exit 1
          fi
          # 2. Fail if the runner's gitconfig has an embedded token.
          scripts/check-gitconfig-no-tokens.sh

      - name: Lint
        run: make lint

      # ── Phase 5.1 Gates ──────────────────────────────────────────────────

      - name: "Gate 1: SKILL.md frontmatter compliance"
        # Validates every active skill has the required SKILL.md structure.
        # Now also validates that ## Self-Improvement section is present.
        # Warnings are reported but do not fail CI; only errors fail the build.
        # Phase 5.2 will enforce --strict once non-conforming skills are fixed.
        run: |
          python scripts/validate_skills.py
          echo "::notice::Run 'python scripts/validate_skills.py --strict' locally to see warnings"

      - name: "Gate 2: Circular import detection"
        # Detects circular import chains in src/ using static AST analysis.
        # Circular imports cause runtime ImportError and slow startup.
        run: python scripts/detect_circular_imports.py

      - name: "Gate 3: Protocol compliance check"
        # Validates that all DELEGATE/HANDBACK YAML files in the queue
        # conform to the core protocol schema. No-op if no queue files exist.
        run: python scripts/check_protocol_compliance.py

      - name: "Gate 4: Skill template conformance report"
        # Generate a non-failing annotated report for the PR review audit trail.
        # The report is emitted as a GitHub step summary for visibility.
        run: python scripts/validate_skills.py --json | python scripts/format_skill_report.py >> "$GITHUB_STEP_SUMMARY" || true

      # ─────────────────────────────────────────────────────────────────────

      - name: Render agents and skills
        run: |
          make render-copilot
          make render-claude
          make render-opencode
          make render-pi
          make render-specs

      - name: Test
        run: make test

      - name: "Gate 5: Harness regression check (Wave 2 baselines)"
        # Enforces minimum test counts per harness and overall.
        # Fails the build if any harness loses tests vs Wave 2 baselines:
        #   OpenCode harness:    ≥94 tests   (tests/harnesses/opencode/)
        #   Claude Code harness: ≥103 tests  (tests/harnesses/claude_code/)
        #   Copilot CLI harness: ≥71 tests   (tests/harnesses/copilot-cli/)
        #   Full test suite:     ≥4925 tests  (total collected)
        # Update baselines only via SPEC change + QE sign-off (see docs/REGRESSION-GATE-POLICY.md).
        run: python renderer/scripts/check_test_regression.py

      - name: Verify
        run: make verify

      - name: "Audit: Token spend annotation"
        # Non-failing annotation of commit-level token costs.
        # Reads from data/metrics/ if available and annotates the step summary.
        # Phase 5.2 will wire this to a cost-tracking budget gate.
        if: always()
        run: python scripts/annotate_token_costs.py >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_Token cost annotation skipped (no metrics data)_" >> "$GITHUB_STEP_SUMMARY"

  auto-tag:
    name: Auto-Tag (Semantic Versioning)
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create semantic version tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          default_prerelease_bump: prerelease
          release_branches: main
          custom_release_rules: "feat:minor:✨ Features,fix:patch:🐛 Bug Fixes,docs:patch:📚 Documentation,chore:patch:🔧 Chores,refactor:patch:♻️ Refactoring,perf:patch:⚡ Performance,security:patch:🔒 Security"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
