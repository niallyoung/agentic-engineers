name: Evaluation Framework Nightly

on:
  schedule:
    # 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  eval-tests:
    name: Run Evaluation Framework Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyyaml pytest pytest-cov
      
      - name: Run evaluation framework tests
        id: eval-tests
        run: |
          python -m src.skills._meta.evaluation_framework.main \
            --run-tests tests/evals/ \
            --json-report /tmp/evals_results.json \
            --md-report /tmp/evals_results.md \
            --csv-report /tmp/evals_results.csv \
            --min-pass-rate 95.0 \
            --verbose
        continue-on-error: true
      
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: evaluation-reports
          path: |
            /tmp/evals_results.json
            /tmp/evals_results.md
            /tmp/evals_results.csv
          retention-days: 30
      
      - name: Parse and display results
        if: always()
        run: |
          if [ -f /tmp/evals_results.md ]; then
            echo "## Evaluation Framework Results" >> $GITHUB_STEP_SUMMARY
            cat /tmp/evals_results.md >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Check test results
        if: steps.eval-tests.outcome == 'failure'
        run: |
          echo "❌ Evaluation framework detected failures or regressions"
          if [ -f /tmp/evals_results.json ]; then
            python -c "
            import json
            with open('/tmp/evals_results.json') as f:
              data = json.load(f)
              summary = data.get('summary', {})
              regressions = data.get('regressions', {})
              
              if regressions:
                print('\n## Regressions Detected:')
                for key, tests in regressions.items():
                  print(f'  {key}: {len(tests)} failure(s)')
                  for test in tests:
                    print(f'    - {test}')
            "
          fi
          exit 1
      
      - name: Post success notification
        if: steps.eval-tests.outcome == 'success'
        run: |
          echo "✅ Evaluation framework passed all tests"
          if [ -f /tmp/evals_results.json ]; then
            python -c "
            import json
            with open('/tmp/evals_results.json') as f:
              data = json.load(f)
              summary = data.get('summary', {})
              print(f\"  Total: {summary.get('total_tests')} tests\")
              print(f\"  Passed: {summary.get('passed')} ({summary.get('pass_rate')}%)\")
              print(f\"  Failed: {summary.get('failed')}\")
            "
          fi

  security-gate:
    name: Security Gate on Test Failure
    needs: eval-tests
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Alert on framework regression
        run: |
          echo "⚠️  Evaluation framework detected compatibility regressions"
          echo "Action required: Review regression details in job artifacts"
          echo "Artifacts: evaluation-reports"
          exit 1
