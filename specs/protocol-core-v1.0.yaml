version: "1.0"
name: "DELEGATE/HANDBACK Core Protocol"
description: "Minimal, stable core protocol for task delegation"

delegate:
  core_fields:
    task_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9\\-]{1,48}[a-z0-9]$"
      description: "Unique task identifier in kebab-case, 3-50 chars"
      required: true
    skill:
      type: string
      description: "Skill name from skills/"
      required: true
    agent:
      type: string
      enum: [orchestrator, engineer, senior-engineer, lead-engineer,
             principal-engineer, security-engineer, quality-engineer, model-engineer]
      required: true
    scope:
      type: string
      minLength: 75
      description: ">=15 words, what will be done to what"
      required: true
    success_criteria:
      type: array
      minItems: 1
      items:
        type: string
      required: true
    plan:
      type: array
      minItems: 2
      items:
        type: string
        minLength: 9
      required: true
    context:
      oneOf:
        - type: string
          minLength: 100
        - type: array
          minItems: 1
          items:
            type: string
            minLength: 50
      required: true

  extensions:
    parent_task_id: {type: string}
    effort: {enum: [low, medium, high]}
    model: {type: string}
    budget: {type: number, minimum: 0}
    deadline: {type: string, format: "date-time"}
    retry_context: {type: object}
    dependencies: {type: array, items: {type: string}}
    priority: {type: integer, minimum: 1, maximum: 10}

handback:
  core_fields:
    task_id:
      type: string
      required: true
    status:
      type: string
      enum: [success, failure, partial, blocked, escalate]
      required: true
    output:
      description: "Any structured output from the task"
      required: true
    metrics:
      type: object
      required: true
      properties:
        quality: {type: number, minimum: 0, maximum: 1}
        tokens: {type: integer, minimum: 0}
        cost: {type: number, minimum: 0}
        duration_seconds: {type: number, minimum: 0}

  extensions:
    children_created: {type: array, items: {type: string}}
    children_results: {type: object}
    retry_count: {type: integer}
    model_used: {type: string}
    effort_actual: {enum: [low, medium, high]}
    flags: {type: array, items: {type: string}}
    error: {type: string}
