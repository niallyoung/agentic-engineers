---
# Unified Memory Storage Schema
# Version: 1.0
# Purpose: Specification for all memory types in ~/.agentic-engineers/{session_id}/memory/
# This schema is designed for both file-based storage and future database migration

storage_root: ~/.agentic-engineers

session_partition: /{session_id}/memory/

memory_types:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. DELEGATES: Task request and routing payloads
  # ─────────────────────────────────────────────────────────────────────────────

  delegates:
    description: "DELEGATE protocol payloads - immutable task requests"
    storage_path: delegates/
    file_format: yaml
    file_pattern: "{date}-{task_id}-delegate.yaml"
    
    schema:
      handoff_type:
        type: string
        value: "DELEGATE"
        required: true
      
      task_id:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
        required: true
        description: "Unique task identifier, format: YYYY-MM-DD-kebab-case"
        example: "2026-05-24-senior-refactor-event-store"
      
      role:
        type: string
        enum: [engineer, senior_engineer, lead_engineer, principal_engineer, security_engineer, quality_engineer, model_engineer]
        required: true
      
      model:
        type: string
        required: true
        examples: ["claude-haiku-4.5", "claude-sonnet-4.6", "claude-opus-4.7"]
      
      effort:
        type: string
        enum: [low, medium, high, max, epic]
        required: true
      
      estimated_hours:
        type: integer
        minimum: 1
        required: true
      
      scope:
        type: string
        min_length: 15
        required: true
      
      success_criteria:
        type: array
        items:
          type: string
          min_length: 10
        min_items: 1
        required: true
      
      plan:
        type: array
        items:
          type: object
          properties:
            step:
              type: integer
            action:
              type: string
              min_length: 15
            duration_minutes:
              type: integer
              minimum: 5
        min_items: 1
        required: true
      
      context:
        type: string
        min_length: 100
        required: true
      
      timestamp_created:
        type: string
        format: "iso8601"
        required: true
      
      timestamp_delegated:
        type: string
        format: "iso8601"
        required: true
    
    index:
      file: delegates/index.jsonl
      format: json-lines
      fields:
        - task_id
        - timestamp_delegated
        - role
        - effort
        - model
        - status
      example_line: |
        {"task_id": "2026-05-24-task1", "timestamp_delegated": "2026-05-24T10:16:00Z", "role": "senior_engineer", "effort": "high", "model": "claude-sonnet-4.6", "status": "pending"}
    
    retention: permanent
    immutable: true
    queryable_by: [task_id, role, effort, timestamp_delegated]

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. HANDBACKS: Task results and metrics
  # ─────────────────────────────────────────────────────────────────────────────

  handbacks:
    description: "HANDBACK protocol payloads - task execution results"
    storage_path: handbacks/
    file_format: yaml
    file_pattern: "{date}-{task_id}-handback.yaml"
    
    schema:
      handoff_type:
        type: string
        value: "HANDBACK"
        required: true
      
      task_id:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
        required: true
      
      status:
        type: string
        enum: [complete, failed, partial, blocked]
        required: true
      
      deliverables:
        type: array
        items:
          type: string
          description: "File path (absolute or repo-relative)"
        required: true
      
      tests:
        type: object
        properties:
          passed:
            type: integer
            minimum: 0
          failed:
            type: integer
            minimum: 0
          coverage:
            type: number
            minimum: 0
            maximum: 100
          framework:
            type: string
          notes:
            type: string
        required: [passed, failed, coverage]
      
      quality_score:
        type: integer
        minimum: 0
        maximum: 100
        required: true
        description: "Validator-computed quality score (40% format, 35% content, 25% quality)"
      
      effort_actual:
        type: number
        minimum: 0
      
      tokens_in:
        type: integer
        minimum: 1
        required: true
      
      tokens_out:
        type: integer
        minimum: 1
        required: true
      
      duration_minutes:
        type: integer
        minimum: 1
        required: true
      
      notes:
        type: string
        min_length: 5
        required: true
      
      timestamp_received:
        type: string
        format: "iso8601"
        required: true
    
    index:
      file: handbacks/index.jsonl
      format: json-lines
      fields:
        - task_id
        - timestamp_received
        - status
        - quality_score
        - tokens_in
        - tokens_out
        - effort_actual
      example_line: |
        {"task_id": "2026-05-24-task1", "timestamp_received": "2026-05-24T12:40:00Z", "status": "complete", "quality_score": 92, "tokens_in": 45230, "tokens_out": 12847, "effort_actual": 13.5}
    
    retention: permanent
    immutable: true
    queryable_by: [task_id, status, quality_score, timestamp_received]

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. EXECUTION LOGS: Structured per-agent, per-phase logs
  # ─────────────────────────────────────────────────────────────────────────────

  logs:
    description: "Per-agent, per-phase execution logs (structured events)"
    storage_path: logs/
    file_format: json-lines
    file_pattern: "{agent_type}-{phase}-{timestamp}.jsonl"
    
    schema:
      timestamp:
        type: string
        format: "iso8601"
        required: true
      
      session_id:
        type: string
        format: "uuid"
        required: true
      
      agent_type:
        type: string
        enum: [engineer, senior_engineer, lead_engineer, principal_engineer, security_engineer, quality_engineer, model_engineer, orchestrator, unknown]
        required: true
      
      task_id:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$"
      
      phase:
        type: string
        description: "Execution phase (phase1, phase2, testing, deployment, etc)"
        required: true
      
      level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        required: true
      
      message:
        type: string
        min_length: 1
        required: true
      
      context:
        type: object
        description: "Additional context (step, file, action, etc)"
        additionalProperties: true
      
      metrics:
        type: object
        description: "Performance metrics (duration_ms, tokens_used, api_calls)"
        additionalProperties: true
    
    example_event: |
      {
        "timestamp": "2026-05-24T10:15:23.456Z",
        "session_id": "771628bc-263c-4c9e-98c9-5f24a6418b95",
        "agent_type": "engineer",
        "task_id": "2026-05-24-task1",
        "phase": "phase1",
        "level": "INFO",
        "message": "Starting task execution",
        "context": {"step": 1, "current_file": "src/api/auth.py", "action": "Implementing JWT validation"},
        "metrics": {"duration_ms": 1230, "tokens_used": 450, "api_calls": 2}
      }
    
    index:
      file: logs/index.jsonl
      format: json-lines
      fields:
        - timestamp
        - agent_type
        - task_id
        - phase
        - level
      comment: "For efficiency, index contains first 100 events only; full scan available via grep"
    
    retention: "90 days (configurable via metadata.json:config.log_retention_days)"
    immutable: true
    queryable_by: [agent_type, phase, level, task_id, timestamp]

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. THINKING: Agent reasoning and chain-of-thought output
  # ─────────────────────────────────────────────────────────────────────────────

  thinking:
    description: "Agent reasoning, chain-of-thought, and decision rationale"
    storage_path: thinking/
    file_format: markdown
    file_pattern: "{date}-{task_id}-thinking.md"
    
    schema:
      title:
        type: string
        format: "# Chain-of-Thought: {task_id}"
      
      sections:
        - "Problem Analysis: Agent's interpretation of the problem"
        - "Approach: How agent will solve it"
        - "Key Decisions: Decision 1: [rationale], Decision 2: [rationale]"
        - "Risk Assessment: Risk 1: [mitigation], Risk 2: [mitigation]"
        - "Execution Steps: Numbered, detailed steps"
        - "Verification: How to verify success"
    
    example_structure: |
      # Chain-of-Thought: 2026-05-24-senior-refactor-event-store
      
      ## Problem Analysis
      Current DynamoDB event store requires full scan on every sync, causing high API costs.
      
      ## Approach
      Implement delta-token cursor-based sync (like DynamoDB GSI with last_sync_cursor).
      
      ## Key Decisions
      1. Use DynamoDB LSI for efficient cursor-based queries (alternative: add `last_sync_id` sort key)
      2. Store cursor in session metadata to avoid client-side state management
      
      ## Risk Assessment
      - Risk: Cursor staleness if session crashes → Mitigation: Validate cursor on recovery
      - Risk: Backward compatibility → Mitigation: Support both old and new scan methods
      
      ## Execution Steps
      1. Analyze current store.go...
      2. Design cursor model...
      3. Implement GetEventsWithCursor()...
      
      ## Verification
      - Benchmark: 90% fewer API calls
      - Test coverage: Edge cases for cursor expiry, invalidation
    
    index:
      file: thinking/index.jsonl
      format: json-lines
      fields:
        - task_id
        - timestamp_created
        - model
        - length_chars
      example_line: |
        {"task_id": "2026-05-24-task1", "timestamp_created": "2026-05-24T10:15:00Z", "model": "claude-sonnet-4.6", "length_chars": 8500}
    
    retention: permanent
    immutable: true
    queryable_by: [task_id, timestamp_created, model]

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. SPANS/TRACES: OpenTelemetry trace data
  # ─────────────────────────────────────────────────────────────────────────────

  spans:
    description: "OpenTelemetry spans and traces for performance analysis"
    storage_path: spans/
    file_format: yaml
    file_pattern: "{date}-span-{id}.yaml"
    
    schema:
      trace_id:
        type: string
        format: "hex (32 chars)"
      
      span_id:
        type: string
        format: "hex (16 chars)"
      
      parent_span_id:
        type: string
        format: "hex (16 chars)"
      
      span_name:
        type: string
        examples: ["agent.engineer.execution", "task.delegate", "task.handback"]
      
      start_time:
        type: string
        format: "iso8601"
      
      end_time:
        type: string
        format: "iso8601"
      
      duration_ms:
        type: number
      
      status:
        type: string
        enum: [ok, error, deadline_exceeded]
      
      attributes:
        type: object
        additionalProperties: true
      
      events:
        type: array
        items:
          type: object
    
    index:
      file: spans/index.jsonl
      format: json-lines
      fields:
        - trace_id
        - span_name
        - start_time
        - duration_ms
        - status
      example_line: |
        {"trace_id": "abc123", "span_name": "agent.engineer.execution", "start_time": "2026-05-24T10:15:00Z", "duration_ms": 30008, "status": "ok"}
    
    retention: "30 days (configurable via metadata.json:config.trace_retention_days)"
    immutable: true
    queryable_by: [trace_id, span_name, start_time, status]

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. FEEDBACK: Quality Engineer feedback and corrections
  # ─────────────────────────────────────────────────────────────────────────────

  feedback:
    description: "Quality Engineer review feedback and corrections"
    storage_path: feedback/
    file_format: yaml
    file_pattern: "{date}-{task_id}-feedback.yaml"
    
    schema:
      task_id:
        type: string
        required: true
      
      reviewer:
        type: string
        required: true
      
      timestamp:
        type: string
        format: "iso8601"
        required: true
      
      reviewed:
        type: boolean
        required: true
      
      reviewer_notes:
        type: string
      
      improvements:
        type: array
        items:
          type: string
      
      approve:
        type: boolean
        required: true
      
      quality_score_feedback:
        type: integer
        minimum: 0
        maximum: 100
    
    index:
      file: feedback/index.jsonl
      format: json-lines
      fields:
        - task_id
        - timestamp
        - reviewer
        - approve
      example_line: |
        {"task_id": "2026-05-24-task1", "timestamp": "2026-05-24T13:00:00Z", "reviewer": "lead-engineer-bot", "approve": true}
    
    retention: permanent
    immutable: false
    queryable_by: [task_id, reviewer, approve, timestamp]

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. METRICS: Aggregated metrics and analytics
  # ─────────────────────────────────────────────────────────────────────────────

  metrics:
    description: "Aggregated metrics: token usage, quality scores, execution timeline, cost"
    storage_path: metrics/
    
    subfiles:
      
      token_usage.json:
        schema:
          total_tokens:
            type: integer
          total_tokens_in:
            type: integer
          total_tokens_out:
            type: integer
          by_role:
            type: object
            example: {"engineer": 50000, "senior_engineer": 100000, "lead_engineer": 30000}
          by_model:
            type: object
            example: {"claude-haiku-4.5": 40000, "claude-sonnet-4.6": 120000}
          by_task:
            type: array
            items:
              type: object
              properties:
                task_id: string
                tokens_in: integer
                tokens_out: integer
                model: string
          timeline:
            type: array
            description: "Tokens per day (for trending)"
            items:
              type: object
              properties:
                date: string
                tokens: integer
      
      quality_scores.json:
        schema:
          average_quality:
            type: number
            minimum: 0
            maximum: 100
          by_task:
            type: array
            items:
              type: object
              properties:
                task_id: string
                quality_score: integer
                status: string
          by_phase:
            type: object
            example: {"phase1": 85, "phase2": 90, "phase3": 88}
          by_agent_type:
            type: object
            example: {"engineer": 85, "senior_engineer": 92}
      
      execution_timeline.json:
        schema:
          total_tasks:
            type: integer
          tasks:
            type: array
            items:
              type: object
              properties:
                task_id: string
                timestamp_start: string
                timestamp_end: string
                duration_minutes: integer
          phases:
            type: object
            description: "Timeline of phase transitions"
      
      cost_analysis.json:
        schema:
          total_cost_usd:
            type: number
          by_model:
            type: object
            example:
              claude_haiku_4_5: {cost_usd: 0.32, tokens: 40000}
              claude_sonnet_4_6: {cost_usd: 3.60, tokens: 120000}
              claude_opus_4_7: {cost_usd: 1.35, tokens: 90000}
          by_role:
            type: object
    
    retention: permanent
    immutable: false
    update_frequency: "per-task (append-only)"
    queryable_by: [role, model, task_id, date]

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. METADATA: Session configuration and timeline
  # ─────────────────────────────────────────────────────────────────────────────

  metadata:
    description: "Session-level metadata, configuration, and timeline"
    storage_path: metadata.json
    file_format: json
    
    schema:
      session_id:
        type: string
        format: "uuid"
        required: true
      
      harness:
        type: string
        enum: [local, github, cloud]
        required: true
      
      created_at:
        type: string
        format: "iso8601"
        required: true
      
      last_accessed_at:
        type: string
        format: "iso8601"
        required: true
      
      user:
        type: string
        required: true
      
      repository:
        type: string
        required: true
      
      branch:
        type: string
        required: true
      
      phase:
        type: string
        description: "Current phase (design, implementation, testing, deployment)"
      
      timeline:
        type: object
        properties:
          design_started:
            type: string
            format: "iso8601"
          implementation_started:
            type: string
            format: "iso8601"
          testing_started:
            type: string
            format: "iso8601"
          completed:
            type: string
            format: "iso8601"
      
      decisions:
        type: array
        items:
          type: object
          properties:
            timestamp:
              type: string
              format: "iso8601"
            decision:
              type: string
            rationale:
              type: string
      
      config:
        type: object
        properties:
          log_retention_days:
            type: integer
            default: 90
          trace_retention_days:
            type: integer
            default: 30
          encryption_enabled:
            type: boolean
            default: false
          backup_enabled:
            type: boolean
            default: true
          backup_frequency:
            type: string
            enum: [daily, weekly, monthly]
          backup_location:
            type: string
            description: "S3 bucket or local path"
          index_rebuild_frequency:
            type: string
            enum: [daily, weekly, never]
    
    example: |
      {
        "session_id": "771628bc-263c-4c9e-98c9-5f24a6418b95",
        "harness": "local",
        "created_at": "2026-05-24T10:00:00Z",
        "last_accessed_at": "2026-05-24T14:30:00Z",
        "user": "niallyoung",
        "repository": "agentic-engineers",
        "branch": "feature/memory-architecture",
        "phase": "design",
        "timeline": {"design_started": "2026-05-24T10:00:00Z"},
        "decisions": [{"timestamp": "2026-05-24T10:15:00Z", "decision": "Use centralized memory", "rationale": "..."}],
        "config": {"log_retention_days": 90, "trace_retention_days": 30, "encryption_enabled": false}
      }
    
    retention: permanent
    immutable: false
    queryable_by: [session_id, user, repository, branch]

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. TIMELINE: Session event timeline
  # ─────────────────────────────────────────────────────────────────────────────

  timeline:
    description: "Chronological event timeline for the session"
    storage_path: timeline.jsonl
    file_format: json-lines
    
    schema:
      timestamp:
        type: string
        format: "iso8601"
        required: true
      
      event_type:
        type: string
        enum:
          - session_created
          - delegate_created
          - delegate_queued
          - handback_received
          - task_complete
          - phase_transition
          - error_occurred
          - retry_triggered
          - feedback_received
        required: true
      
      task_id:
        type: string
      
      agent:
        type: string
      
      details:
        type: string
        min_length: 1
        required: true
      
      metadata:
        type: object
        additionalProperties: true
    
    example_events: |
      {"timestamp": "2026-05-24T10:00:00Z", "event_type": "session_created", "agent": "orchestrator", "details": "Session initialized"}
      {"timestamp": "2026-05-24T10:15:00Z", "event_type": "delegate_created", "task_id": "2026-05-24-task1", "agent": "senior_engineer", "details": "DELEGATE queued for processing"}
      {"timestamp": "2026-05-24T12:40:00Z", "event_type": "handback_received", "task_id": "2026-05-24-task1", "agent": "senior_engineer", "details": "HANDBACK received with quality_score=92"}
    
    retention: permanent
    immutable: true
    queryable_by: [event_type, task_id, agent, timestamp]

  # ─────────────────────────────────────────────────────────────────────────────
  # 10. AUDIT: Immutable audit trail
  # ─────────────────────────────────────────────────────────────────────────────

  audit:
    description: "Immutable audit log of all memory operations"
    storage_path: audit.log
    file_format: text
    
    format: "{timestamp} | {operation} | {entity_type}={entity_id} | {details} | {checksum}"
    
    operations:
      - SESSION_CREATE
      - DELEGATE_WRITE
      - HANDBACK_WRITE
      - LOG_WRITE
      - THINKING_WRITE
      - METADATA_UPDATE
      - FEEDBACK_WRITE
      - INDEX_REBUILD
      - CLEANUP_EXPIRED
      - RESTORE_FROM_BACKUP
    
    example_lines: |
      2026-05-24T10:00:00Z | SESSION_CREATE | session_id=771628bc-263c-4c9e-98c9-5f24a6418b95 | harness=local | checksum=a1b2c3d4
      2026-05-24T10:16:00Z | DELEGATE_WRITE | task_id=2026-05-24-task1 | role=senior_engineer | file_size=2048 | checksum=abc123
      2026-05-24T12:40:00Z | HANDBACK_WRITE | task_id=2026-05-24-task1 | status=complete | quality_score=92 | file_size=1024 | checksum=def456
    
    retention: permanent
    immutable: true
    append_only: true

---

# Query Examples

query_examples:
  
  find_delegates_by_role:
    description: "Find all DELEGATEs for a specific role"
    command: "grep 'senior_engineer' delegates/index.jsonl | jq '.task_id'"
  
  get_task_quality_score:
    description: "Get quality score for a specific task"
    command: "grep '2026-05-24-task1' handbacks/index.jsonl | jq '.quality_score'"
  
  list_failed_tasks:
    description: "List all failed tasks"
    command: "grep '\"failed\"' handbacks/index.jsonl | jq '.task_id'"
  
  plot_token_timeline:
    description: "Get token usage over time"
    command: "cat metrics/token_usage.json | jq '.timeline'"
  
  find_logs_for_phase:
    description: "Find all logs for engineering phase1"
    command: "grep 'phase1' logs/engineer-*.jsonl | jq '.message'"

---

# File System Layout

filesystem_layout: |
  ~/.agentic-engineers/
  ├── {session_id}/
  │   └── memory/
  │       ├── delegates/
  │       │   ├── 2026-05-24-task1-delegate.yaml
  │       │   ├── 2026-05-24-task2-delegate.yaml
  │       │   └── index.jsonl
  │       ├── handbacks/
  │       │   ├── 2026-05-24-task1-handback.yaml
  │       │   └── index.jsonl
  │       ├── logs/
  │       │   ├── engineer-phase1-20260524-143022.jsonl
  │       │   ├── senior-engineer-phase1-20260524-153050.jsonl
  │       │   └── index.jsonl
  │       ├── thinking/
  │       │   ├── 2026-05-24-task1-thinking.md
  │       │   └── index.jsonl
  │       ├── spans/
  │       │   ├── 2026-05-24-span-001.yaml
  │       │   └── index.jsonl
  │       ├── feedback/
  │       │   └── index.jsonl
  │       ├── metrics/
  │       │   ├── token_usage.json
  │       │   ├── quality_scores.json
  │       │   ├── execution_timeline.json
  │       │   └── cost_analysis.json
  │       ├── metadata.json
  │       ├── timeline.jsonl
  │       └── audit.log

---

# Validation Rules

validation_rules:
  
  file_existence:
    - "All files in deliverables must exist on disk"
    - "Symbolic links not allowed"
    - "File permissions must be readable by agent"
  
  yaml_validity:
    - "All DELEGATE/HANDBACK/feedback files must be valid YAML"
    - "No trailing commas in JSON files"
  
  index_consistency:
    - "Index files must be sorted by timestamp"
    - "Index entries must reference existing files"
    - "No duplicate entries in index"
  
  schema_conformance:
    - "All required fields present"
    - "No unknown fields (forward-compatible)"
    - "Field types match schema"
  
  immutability:
    - "DELEGATE/HANDBACK files cannot be modified after creation"
    - "Thinking files read-only after 30 minutes"
    - "Audit log append-only"

