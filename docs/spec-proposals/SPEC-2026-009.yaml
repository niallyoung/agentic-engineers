impact:
  breaking_for_users: true
  user_impact: |
    Any tooling, script, or documentation that reads or writes
    `~/.agentic-engineers/{harness}/{session-id}/queue/` no longer has a SPEC-sanctioned
    target — that tree is not written by any surviving code path (queue-management and
    queue-query are deleted in the same effort). Users relying on queue files as an
    external audit log or integration point must instead read the harness's own session
    transcript/history mechanism, if their harness exposes one. This is a deliberate,
    user-directed breaking change, not an oversight.
  code_impact: |
    None from this proposal directly (documentation only); it ratifies deletions executed
    by the concurrent src/**-scoped DELEGATE in the same root effort.
  observability_impact: |
    The append-only JSONL audit log described in ORCHESTRATOR-FIRST clause 7
    (`~/.agentic-engineers/{harness}/{session-id}/audit/events-YYYY-MM-DD.jsonl`) is
    unaffected by this proposal — it was already a distinct mechanism from the queue
    directory tree (different path, different purpose: structured lifecycle events vs.
    DELEGATE/HANDBACK record copies) and clause 7 is untouched.
  integrity_impact: |
    Removes a LOCKED section describing infrastructure that no longer exists, rather than
    leaving the SPEC internally contradictory (a LOCKED section mandating paths and
    enforcement for deleted code) the way SPEC-2026-008 found and fixed a smaller instance
    of the same problem one proposal ago.
  risk: |
    Medium. This is the first proposal in this LOCKED-section-correction lineage to
    remove rather than restate a LOCKED section, and it does so under a non-standard
    authorization path (user directive, not principal/security peer review). The risk is
    process precedent, not technical risk — the code this section described is already
    gone regardless of what this proposal does.

compatibility_notes: |
  Not backward compatible with any consumer of the queue directory tree. Backward
  compatible with the DELEGATE/HANDBACK message schema itself (`task_id`, `handoff_type`,
  `scope`, `plan`, `success_criteria`, `status`, `output`, `metrics`, etc.) — none of that
  changes; only its storage/audit mechanism does.

breaking_change: true
migration_path: |
  None provided by this proposal. No migration script writes or reads the old queue path;
  users who need historical queue records from before this change should recover them
  from their own backups of `~/.agentic-engineers/` (ordinary filesystem state, not
  managed by any tool this proposal touches) — see `docs/guides/deployment.md`'s prior
  backup guidance, itself updated by this same effort to describe transcript-based audit
  instead.

