# ---------------------------------------------------------------------------
# SUMMARY
# ---------------------------------------------------------------------------
summary: |
  Removes the filesystem queue from the framework entirely, per an explicit directive
  from the repository owner (relayed via the routing DELEGATE that authorizes this
  proposal — see Approval below). Dispatch is direct sub-agent spawn only; there is no
  `~/.agentic-engineers/{harness}/{session-id}/queue/` directory tree, no `enqueue()`,
  no `incoming/`/`processing/`/`done/`/`failed/` state machine, and no audit-trail write
  step separate from the spawn itself. The durable audit record is the harness session
  transcript: every DELEGATE, as it appears verbatim as a sub-agent spawn's prompt, and
  every HANDBACK, as it appears verbatim as that spawn call's result, together constitute
  the record of what happened — nothing else needs to be written for a delegation to be
  auditable.

  This proposal removes the LOCKED "Queue Architecture & Paths" section outright (it was
  previously carried over byte-identical, receiving only narrow surgical corrections,
  through SPEC-2026-005, SPEC-2026-006, and SPEC-2026-008) and the "Queue SLA & Governance"
  section that depended on it. ORCHESTRATOR-FIRST clause 4 — "The Queue is a Durable Inbox
  and Audit Substrate, Not the Dispatch Mechanism" — is rewritten to state the new ground
  truth: there is no queue, inbox, or substrate; the transcript is the record. Every other
  queue mention in docs/SPEC.md, the companion docs tree, README.md, and config/ is swept:
  fixed where the surrounding content survives, or removed along with content describing
  now-deleted subsystems. `docs/QUEUE-PROTOCOL.md` is deleted outright.

# ---------------------------------------------------------------------------
# JUSTIFICATION (evidence-based)
# ---------------------------------------------------------------------------
rationale: |
  EVIDENCE 1 - explicit, recorded user authorization for a LOCKED-section removal.
  The routing DELEGATE for this work (task_id: task-2026-08-13-queue-removal-spec-docs,
  ancestry: [task-2026-08-13-queue-removal-root]) states verbatim: "USER DIRECTIVE (this
  is your authorization — record it): the filesystem queue is removed entirely; dispatch
  is direct sub-agent spawn; the durable audit record is the harness session transcript."
  The spec-management protocol's normal authorization matrix (Principal/Security/Lead
  Engineer proposal + peer approval_chain) governs ordinary LOCKED-section edits; a LOCKED
  section's outright *removal* is treated here as requiring elevated authorization, which
  the repo owner supplied directly rather than through the peer-approval chain. This
  proposal records that authorization plainly (see Approval below) rather than fabricating
  a peer approval_chain that did not occur.

  EVIDENCE 2 - the queue was already narrowed to audit-only bookkeeping by SPEC-2026-004
  (2026-08-09), which replaced queue-and-poll dispatch with direct sub-agent spawn after
  an audit of 16 live session partitions found zero tasks ever traversed the queue as a
  dispatch mechanism. Since that change, the queue's only remaining role was recording a
  copy of a DELEGATE/HANDBACK exchange that had already happened synchronously in-context.
  This proposal completes that trajectory: if the record already exists in the harness
  session transcript at the moment of dispatch, a second, file-based copy of the same
  information is redundant bookkeeping, not a distinct source of truth.

  EVIDENCE 3 - the underlying skills are gone. `src/skills/queue-management/` and
  `src/skills/queue-query/` are deleted in the same effort (concurrent senior-engineer
  DELEGATE, src/**-scoped; verified via `git status` showing both directories staged as
  `D` before this proposal was authored). `enqueue()`, `QueueOperations`, and
  `get_queue_path()` — the only sanctioned writers/readers of the queue per the (now
  deleted) "Runtime Enforcement: enqueue() is the Mandatory Gateway" section of
  `docs/QUEUE-PROTOCOL.md` — no longer exist in the tree. A SPEC section mandating paths,
  subdirectories, and enforcement rules for code that does not exist would describe
  nothing real.

  EVIDENCE 4 - the "Queue SLA & Governance" section's own source-of-truth file never
  existed. It named `config/queue-sla.yaml` as authoritative for every threshold in its
  tables; `config/` contains only `deployment.yaml`, `FRAMEWORK-MANIFEST.yaml`,
  `orchestration.yaml`, and `token_budget.yaml` — `queue-sla.yaml` was never created.
  That section documented thresholds enforced by nothing, for a file that was never
  written, describing a directory structure that is now also gone. Its removal fixes a
  pre-existing accuracy gap, not just a queue-removal consequence.

proposed_changes:
  "Executive Summary": |
    Replaced the paragraph describing the queue as "a durable inbox and audit substrate
    (LOCKED paths, unchanged)" with one stating plainly that there is no filesystem queue
    and that the harness session transcript (spawn prompt + spawn result) is the durable
    audit record.
  "ORCHESTRATOR-FIRST EXECUTION MODEL — clause 4": |
    Retitled from "The Queue is a Durable Inbox and Audit Substrate, Not the Dispatch
    Mechanism" to "The Harness Session Transcript is the Durable Audit Record; There Is No
    Filesystem Queue." Body rewritten to state that dispatch and results are exchanged
    entirely in-context, that spawn/result pair as it appears in the transcript is the
    record, and that there is no inbox, no session-partitioned directory tree, and no
    `enqueue()` step. A task submitted while no Orchestrator context is live has no durable
    holding area under this model — it reaches the Orchestrator directly the next time one
    is invoked, rather than waiting in an `incoming/` directory. Clauses 1-3 and 5-8 of the
    same section are untouched (they describe dispatch mechanics, recursion limits, tools
    frontmatter, the append-only JSONL audit log, and the no-external-scripts constraint —
    none of which named the filesystem queue as their subject).
  "Queue Architecture & Paths (LOCKED SPEC)": |
    Section deleted in full — the path template, Supported Harnesses list, Queue
    Subdirectories table, Unsupported Legacy Paths migration table, all five Enforcement
    Rules, and Validation Procedures. Nothing is retained or restated; there is no
    replacement path scheme because there is no queue to have a path.
  "Queue SLA & Governance": |
    Section deleted in full — SLA Thresholds table, Retry & Backoff, Orphan/Stall
    Detection, Escalation Routing table, and the Source of Truth pointer to the
    never-created `config/queue-sla.yaml`.
  "COMPLETE SCRIPT INVENTORY": |
    One wording fix: the `renderer/scripts/` exemption note dropped "or queue processing"
    from "never participate in runtime orchestration or queue processing" (now just
    "never participate in runtime orchestration"), since queue processing is no longer a
    category of thing scripts could participate in. The script tables themselves are
    unchanged — `scripts/check_protocol_compliance.py` still exists in the tree as of this
    proposal (verified via `ls scripts/`) and is left listed; if a concurrent DELEGATE
    deletes it, that is a follow-up correction for whichever proposal records that
    deletion, not this one (this proposal's routing DELEGATE flagged this exact
    reconciliation risk and instructed listing only what could be verified as surviving).
  "References": |
    Dropped the `docs/QUEUE-PROTOCOL.md` bullet (file deleted by this same effort).
    `docs/PROTOCOL.md`'s reference line was already describing itself correctly and is
    unchanged.
  "Repository Structure": |
    Skill list under `src/skills/` drops `queue-management` and `queue-query`; "8
    surviving skills" becomes "6 surviving skills" (orchestrator, protocol-validator,
    spec-validator, spec-management, skill-improvement-feedback, codex-agent-cleanup).
    The `docs/` line drops the `QUEUE-PROTOCOL.md` filename mention.
  "Update Log": |
    This entry.
  "Frontmatter / header": |
    `description` dropped "queue mechanics"; `updated` and the body's "Last Updated" line
    advanced to 2026-08-13; `phase` appends ", queue removed (SPEC-2026-009)" alongside
    the existing "Post-slimdown (SPEC-2026-005)" marker. `version` is unchanged (2.0),
    consistent with SPEC-2026-006/007/008 treating this as an amendment within the current
    major version rather than a version bump.

