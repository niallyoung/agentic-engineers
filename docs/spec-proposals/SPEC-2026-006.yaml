# ---------------------------------------------------------------------------
# SUMMARY
# ---------------------------------------------------------------------------
summary: |
  The LOCKED "Queue Architecture & Paths" section still enumerates the pi harness in four
  places (the harness-directory tree comment, the "Supported Harnesses" bullet list, the
  subdirectory-coverage sentence, and the harness-renderers compliance sentence), even
  though the pi harness was dropped from the framework in the 2026-08-11 slimdown
  (SPEC-2026-005 and its sibling work packages). The same four spots omit codex, which is
  a live, supported render target with its own renderer and dist/ output. This proposal
  performs four literal string swaps (pi -> codex) in those four spots and nowhere else,
  bringing the harness set to {claude, copilot, opencode, codex} to match the surviving
  renderers and the running system.

# ---------------------------------------------------------------------------
# JUSTIFICATION (evidence-based)
# ---------------------------------------------------------------------------
rationale: |
  This is a follow-up to the 2026-08-11 framework slimdown (SPEC-2026-005), flagged by the
  Quality Engineer gate as a pre-existing defect correctly left untouched by SPEC-2026-005's
  "exactly two sanctioned edits" rule for that LOCKED section (the pi/codex enumeration
  error predates the slimdown and is orthogonal to the verb-only edit SPEC-2026-005 made).

  EVIDENCE 1 - pi is gone from the renderer and from dist/.
  `renderer/scripts/` currently contains render-claude.sh, render-codex.py,
  render-copilot-agents.py/.sh, render-copilot.sh, and render-opencode.sh — no render-pi
  script of any kind. `dist/` contains claude/, codex/, copilot/, opencode/, specs/ — no
  pi/. `renderer/scripts/check_test_regression.py:18` documents the current baseline in
  its own header comment as "4 harnesses — no pi", confirming the drop was intentional and
  is already the operative reality elsewhere in the codebase.

  EVIDENCE 2 - codex is live and was added after this section's lock date, not omitted by
  oversight.
  `git log --oneline --follow -- renderer/scripts/render-codex.py` shows the file's
  earliest commit is 1361afa ("feat: strict Codex orchestrator-only mode (#64)"), dated
  2026-06-17. The Queue Architecture & Paths section carries the banner "SPECIFICATION
  LOCKED as of 2026-05-26" (path order later revised 2026-06-11). Codex support therefore
  postdates the lock by three weeks; its absence from the original locked enumeration was
  an accurate snapshot at lock time, not a defect introduced then. The defect is that the
  section was never amended to add codex once it became a supported harness, and separately
  was never amended to remove pi once that harness was dropped.

  EVIDENCE 3 - scope is confined to the Queue Architecture & Paths section only.
  The sibling LOCKED section "Model Naming & Harness Compatibility" also still references
  pi (the "Pi (pi.dev)" row in the Harness-Specific Model Format table, and `pi` in the
  rendered-output dist path list) and is NOT touched by this proposal — it needs its own
  amendment via a separate proposal, since the routing DELEGATE for this task scoped work
  to the Queue Architecture & Paths section exclusively and a concurrent work stream owns
  renderer/ changes.

proposed_changes:
  "Queue Architecture & Paths (LOCKED SPEC)": |
    Four literal string replacements, each swapping `pi` for `codex` in place with no
    other change to surrounding text, ordering, counts, or structure:
    1. Harness-directory tree comment: "# or claude/, opencode/, pi/ — identical below"
       -> "# or claude/, opencode/, codex/ — identical below".
    2. "Supported Harnesses" bullet list: "- **pi**: Uses
       `~/.agentic-engineers/pi/{session-id}/queue/`" -> "- **codex**: Uses
       `~/.agentic-engineers/codex/{session-id}/queue/`" (bullet stays in the same list
       position, after opencode).
    3. Subdirectory-coverage sentence: "All subdirectories exist across all four harnesses
       (copilot, claude, opencode, pi)." -> "...(copilot, claude, opencode, codex)."
    4. Harness-renderers compliance sentence: "all harness configuration renderers
       (copilot, claude, opencode, pi) MUST output..." -> "...(copilot, claude, opencode,
       codex) MUST output..."
    The path template (`~/.agentic-engineers/{harness}/{session-id}/queue/`), the
    harness-first-then-session-id ordering rule, the `queue/`+`session-state/` state-dir
    list, the "CRITICAL: NO EXCEPTIONS" sentence (count noun "four" is unchanged — the set
    size stays 4), the Queue Subdirectories table, and the entire Unsupported Legacy Paths
    migration table are byte-identical before and after this change.

