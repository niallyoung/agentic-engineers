# ---------------------------------------------------------------------------
# SUMMARY
# ---------------------------------------------------------------------------
summary: |
  The LOCKED "Queue Architecture & Paths" section's Enforcement Rules ("1.
  Queue-Isolation REQUIRED (No Fallback Logic)") still mandate implementation details of
  code the 2026-08-11 framework slimdown deleted: a `QueueManager` class and a standalone
  `_meta/queue-isolation` skill that QueueManager was required to probe for at runtime,
  raising `RuntimeError` if that skill was unavailable. Neither exists anymore. The
  path-isolation logic they described was inlined directly into
  `src/skills/queue-management/scripts/queue_ops.py` as part of the same slimdown (see
  its module docstring: "Path isolation (inlined from the now-deleted
  src/skills/_meta/queue-isolation skill...)"). This proposal restates the first two
  bullets of that rule in implementation-neutral terms that preserve the underlying
  invariant — queue writes MUST be confined to the canonical queue root, and a write that
  cannot be validated as isolated MUST fail hard rather than fall back — while naming the
  surviving enforcement point instead of the deleted class/skill names. The other two
  bullets of the same rule and the rest of the LOCKED section are untouched.

# ---------------------------------------------------------------------------
# JUSTIFICATION (evidence-based)
# ---------------------------------------------------------------------------
rationale: |
  This is a third follow-up correction to the LOCKED "Queue Architecture & Paths" section,
  in the same class as SPEC-2026-006 (harness enumeration) and its sibling
  SPEC-2026-007 (Model Naming & Harness Compatibility) — a stale reference to code the
  2026-08-11 slimdown removed, left uncorrected because SPEC-2026-005/006 scoped their
  edits elsewhere in the same section.

  EVIDENCE 1 - QueueManager and the standalone queue-isolation skill are gone.
  `src/skills/queue-management/__init__.py` states directly: "The former QueueManager
  class hierarchy was removed in the 2026-08-11 framework slimdown (see
  docs/spec-proposals/SPEC-2026-005.yaml)." `src/skills/queue-management/scripts/queue_ops.py`
  lines 80-83 confirm the isolation logic itself was "inlined from the now-deleted
  src/skills/_meta/queue-isolation skill." No `_meta/queue-isolation` directory exists in
  `src/skills/`; `grep -rn "QueueManager" src/ --include="*.py"` returns no hits outside
  historical docstring references to the deletion itself.

  EVIDENCE 2 - the underlying invariant survives, enforced by different code, and was
  verified NOT weakened before restating it. Read `queue_ops.py` end to end:
    - `get_queue_path(session_id, harness, base_dir=None)` (lines 135-140) computes the
      canonical `<base>/<harness>/<session_id>/queue/` path by calling
      `_validate_path_component()` (lines 92-105) on both `session_id` and `harness`
      first.
    - `_validate_path_component()` rejects empty/`.`/`..` values, any value containing
      `/`, `\`, or NUL, and any value outside `[A-Za-z0-9._-]+`, raising `ValueError`
      immediately — before `get_queue_path()` returns a path and before
      `QueueOperations.__init__` creates any directory.
    - `QueueOperations.__init__` (lines 190-219) calls `get_queue_path()` as part of
      resolving `self.session_queue_path` whenever the canonical default `queue_path` is
      used (the production path; only test code explicitly overrides `queue_path` to
      bypass this, a documented test-only affordance in the same constructor docstring).
    - Net effect: a `session_id`/`harness` that cannot be confined to the canonical root
      makes construction fail immediately, with no code path that proceeds to write
      using an unvalidated value. The fail-hard, no-fallback invariant the deleted
      `RuntimeError`-on-unavailable-skill bullet was protecting is enforced by this code,
      just via a different exception type (`ValueError`, raised by the validation itself,
      not `RuntimeError` raised by a skill-availability probe that no longer exists) and
      at a different call site (canonical-path construction, not a
      skill-lookup-then-guard pattern). This proposal's two rewritten bullets therefore
      restate the invariant rather than weaken it — see proposed_changes for the exact
      wording, which deliberately does not claim a specific exception type or "skill
      availability" framing since neither survives as a real runtime concept (the logic
      is compiled into `queue_ops.py`, not dynamically probed for).

  EVIDENCE 3 - scope is confined to the two stale bullets identified by the routing
  DELEGATE; the sibling bullets in the same rule are intentionally untouched even though
  one of them (the "Error message MUST mention canonical path and list all unsupported
  legacy paths" bullet) is also no longer fully accurate — `_validate_path_component()`'s
  `ValueError` messages describe the specific validation failure (illegal characters,
  path separators, empty/traversal value) but do not enumerate the unsupported legacy
  paths table. That is flagged in `out_of_scope` below as a further correction candidate,
  not folded into this proposal, because the routing DELEGATE scoped this task to exactly
  the two bullets naming the deleted `QueueManager`/`queue-isolation` skill.

proposed_changes:
  "Queue Architecture & Paths (LOCKED SPEC)": |
    Two bullet rewrites inside Enforcement Rules > "1. Queue-Isolation REQUIRED (No
    Fallback Logic)"; the rule's heading, its other two bullets, and every other
    Enforcement Rule (2-4) and all preceding subsections (harness-directory tree,
    Supported Harnesses, Queue Subdirectories table, Unsupported Legacy Paths table) are
    byte-identical:

    1. Replace
       "- QueueManager MUST have queue-isolation skill available at runtime"
       with
       "- Every queue write MUST resolve its target path through session/harness
       path-isolation validation that confines it to the canonical
       `~/.agentic-engineers/{harness}/{session-id}/queue/` root (enforced by
       `src/skills/queue-management/scripts/queue_ops.py`, the surviving inlined
       isolation logic)"
    2. Replace
       "- If queue-isolation is unavailable, QueueManager raises `RuntimeError`
       immediately"
       with
       "- If a queue path cannot be validated as confined to that canonical root, the
       write MUST fail immediately with a hard error before any directory or file is
       touched — the operation MUST NOT proceed on an unvalidated path"

    Both rewrites deliberately avoid naming a specific exception type (the surviving code
    raises `ValueError` from validation, not `RuntimeError` from an availability probe)
    and avoid the word "skill" (the logic is compiled into `queue_ops.py`, not a
    separately-invoked skill that could be "available" or "unavailable" at runtime) —
    stating the invariant (mandatory isolation, fail-hard, no fallback) rather than a
    stale implementation mechanism.

