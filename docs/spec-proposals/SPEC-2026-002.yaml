change_id: SPEC-2026-002
proposer: lead-engineer
proposer_role: lead-engineer
timestamp: 2026-06-13T00:00:00Z
affected_sections:
  - "Glossary: Standardized Terminology"
  - "Queue-Based Delegation Mechanics"
  - "Queue Architecture & Paths (LOCKED SPEC)"
proposed_changes:
  "Glossary: Standardized Terminology": |
    Fix the Example cells for the DELEGATE Block and HANDBACK rows: both
    showed the pre-2026-06-11 path order
    (base/{session-id}/copilot/queue/...) as if current. Flip to the
    canonical harness-first order (base/copilot/{session-id}/queue/...).
  "Queue-Based Delegation Mechanics": |
    Fix the "Queue Structure (Session-ID Partitioned)" directory tree,
    which still nested the four harness directories *under* {session-id}/
    (the old order) while presenting itself as the current structure.
    Rebuilt harness-first to match the LOCKED canonical tree, preserving
    the original inline comments and the multi-session illustration
    ({other-session-id} now shown under a harness directory).
  "Queue Architecture & Paths (LOCKED SPEC)": |
    Two fixes inside the LOCKED section:
    1. Legacy Paths migration table: the "Migrated to ..." destination
       paths (which state the CURRENT canonical location) still used the
       old {session-id}-first order. Flipped all three destinations to
       harness-first. The Legacy Path column (the deprecated migration
       *sources*) is deliberately unchanged — those rows correctly
       document old paths as historical/deprecated, not as current.
    2. Erratum in the dated 2026-06-11 revision note: it read "the path
       order is now {harness}/{session-id}, the reverse of the original
       {harness}/{session-id}" — the second occurrence (the *original*
       order) now correctly reads {session-id}/{harness}.
rationale: |
  CU-4 (PR #53, commit c67daaa) reversed the canonical queue path order to
  base/{harness}/{session-id}/queue/ and updated docs/SPEC.md, but four
  residual spots still presented the old {session-id}/{harness} order as
  current/canonical: the Glossary examples (DELEGATE Block, HANDBACK), the
  Queue Structure tree in Queue-Based Delegation Mechanics (found during
  verification, same defect class), the migration destinations in the
  Legacy Paths table, and a self-contradictory "reverse of the original"
  note. Found during the 2026-06-13 plan close-out. These contradictions
  make the SPEC internally inconsistent with its own LOCKED canonical
  section and with the code (queue-isolation, harness_session_manager),
  which already use harness-first paths.
compatibility_notes: |
  Backward compatible. Documentation-only correction: no queue paths,
  protocol fields, or model IDs change behaviour — the canonical order was
  already {harness}/{session-id} per CU-4; this only removes stale
  presentations of the old order. Out of scope and deliberately untouched:
  root SPEC.md (being consolidated in PR #54).
breaking_change: false
