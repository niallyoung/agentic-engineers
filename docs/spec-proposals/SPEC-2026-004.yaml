# ---------------------------------------------------------------------------
# IMPACT
# ---------------------------------------------------------------------------
impact:
  breaking_for_users: false
  user_impact: |
    No breaking change to users. The queue-polling path being replaced has never processed a
    task in any of the 16 live sessions, so there is no working behaviour to preserve and no
    in-flight work to migrate. The queue directories themselves remain valid and in place.
  code_impact: |
    The two primary orchestration modules total ~4,400 LOC (orchestrator.py 2,646 +
    orchestrator_skill.py 1,754), with a further 597 LOC in orchestrator_scheduler.py and
    ~2,300 LOC across queue-management scripts. The polling loop, scheduler and queue state
    machine become dead code under this model. The exact removal boundary is deliberately NOT
    fixed by this proposal; some routing, validation and scoring logic is expected to survive
    as advisory helpers under clause 3. Scoping the removal is Phase 1 work.
  observability_impact: |
    Enables real work tracing for the first time. Every spawn and handback becomes a logged
    event, so metrics and cost reporting can be grounded in evidence rather than inferred
    state transitions or constants.
  integrity_impact: |
    Complements the fabrication-site fixes in commit 6f51a7b by removing the conditions that
    made fabrication attractive: with real events flowing, there is no empty pipeline for
    hardcoded results to paper over.
  risk: |
    Primary risk is that direct spawning ties the delegation lifecycle to a live Orchestrator
    context. Work submitted while no context is running waits in the durable inbox until one
    starts, rather than being picked up by a background poller. Given the poller has never run
    successfully, this is a change in theory rather than in practice, but it should be an
    explicit operator expectation. Retaining the queue as a durable inbox is the mitigation.

# ---------------------------------------------------------------------------
# COMPATIBILITY
# ---------------------------------------------------------------------------
compatibility_notes: |
  Not a breaking change for users: the replaced mechanism has never functioned, so no working
  behaviour is lost and no in-flight work needs migrating. Queue paths are unchanged, so
  anything reading the queue tree continues to work.

  Compatibility with the LOCKED queue section is preserved deliberately. The queue is retained
  and its paths are untouched; only its role is narrowed, from dispatch channel to durable
  inbox plus audit substrate. No path, directory name, or enforcement rule in SPEC.md:626+ is
  altered.

  APPLICATION MECHANISM CAVEAT (for the approver's attention): SpecManager._apply_change()
  currently performs simple replacement as
  `spec_content.replace(f"## {section}", f"## {section}\n{new_text}")`, which INSERTS the new
  text after the section header rather than replacing the section body. Applying this proposal
  through that path unmodified would leave the old lines 26-128 in place beneath the new text
  and duplicate the section. This proposal is therefore filed for review and approval, and its
  application MUST either use a supervised replacement of lines 25-128 or wait on a fix to the
  apply mechanism. That fix is a separate change and is not requested here.

breaking_change: false
migration_path: null

