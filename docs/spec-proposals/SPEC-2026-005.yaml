summary: |
  Consolidated documentation-only amendment executing the framework slimdown's WP-4:
  rewrites docs/SPEC.md from 2,035 to approximately 650 lines. The two LOCKED sections
  (Queue Architecture & Paths; Model Naming & Harness Compatibility) are carried over
  near-verbatim with exactly two sanctioned surgical edits (below). Sections describing
  subsystems deleted elsewhere in this same slimdown (span capture, artifact indexing,
  token-visibility CLI tooling, opus-variant selection, orchestration/agents/*.md
  reference implementations, the Option-1a dual-layer Orchestrator design, and the
  pre-SPEC-2026-004 polling-based Queue-Based Delegation Mechanics flow) are removed.
  The COMPLETE SCRIPT INVENTORY is rewritten from scratch to list the actual surviving
  scripts/ and renderer/scripts/ entries. The Update Log is backfilled with the missing
  SPEC-2026-003 and SPEC-2026-004 entries and this entry is appended.

rationale: |
  The prior docs/SPEC.md accumulated five phases of feature history (5.10 span capture,
  Phase 3 token visibility, Option-1a dual-layer orchestrator design, opus-variant
  selection, a fully duplicated tail section) most of which describes code and docs
  being deleted in this same slimdown (~1.5MB of docs/, dozens of src/ trees). Left in
  place, the spec would describe a system that no longer exists, actively contradicting
  the ORCHESTRATOR-FIRST EXECUTION MODEL section it already contains (that section
  itself was substantially rewritten by SPEC-2026-004 to remove queue-polling dispatch
  in favor of direct sub-agent spawn, but ~14 residual polling references survived
  elsewhere in the document — in the now-deleted Option-1a and Queue-Based Delegation
  Mechanics sections, and in scattered constraint bullets). This proposal completes that
  cleanup and re-baselines the document to the actual post-slimdown architecture.

proposed_changes:
  "L791 verb edit (Queue Architecture & Paths, LOCKED)": |
    "Orchestrator MUST initialize queue polling ONLY from
    `~/.agentic-engineers/{harness}/{session-id}/queue/`" changed to "Orchestrator MUST
    read and write queue records ONLY from
    `~/.agentic-engineers/{harness}/{session-id}/queue/`". Path unchanged; only the verb
    describing the Orchestrator's relationship to the queue changes, consistent with the
    "durable inbox and audit substrate, not the dispatch mechanism" framing already
    established by SPEC-2026-004. This is the only text change inside the LOCKED Queue
    Architecture & Paths section.
  "Model assignment edit (Model Naming & Harness Compatibility, LOCKED)": |
    Orchestrator's assigned model changes from claude-haiku-4.5 to claude-sonnet-5 in two
    places: the Official Model Names table's Claude Haiku 4.5 row drops "Orchestrator, "
    from its use-case description, and the Model Assignment by Agent Role list's
    "Orchestrator:" line changes from "claude-haiku-4.5 (fast, low-cost, routing-only)"
    to "claude-sonnet-5 (routing)". No other content in the LOCKED section changes.
  "COMPLETE SCRIPT INVENTORY": |
    Rewritten from scratch. Lists the actual surviving scripts/ entries
    (check_protocol_compliance.py, detect_circular_imports.py, annotate_token_costs.py,
    format_skill_report.py, run_skill_tests.py, validate_skills.py,
    validate-spec-constraints.py, get_version.py, validate_opencode_config.py,
    entropy_detector.py, opencode-safe.sh, check-gitconfig-no-tokens.sh) plus
    renderer/scripts/ (build-time, exempt) as a directory-level reference, replacing the
    prior inventory's references to skills/*/scripts/ and orchestration/agents/*.py
    paths that no longer exist.
  "Gate re-baselining authorization": |
    Authorizes the interim permissive floor (0) in renderer/scripts/check_test_regression.py
    for the duration of this slimdown, per that script's own header requirement that
    baseline changes go through a SPEC change + QE sign-off. WP-5 of the slimdown is
    responsible for re-baselining from measured post-deletion actuals.
  "All other affected sections": |
    Either carried forward with trimmed prose (ORCHESTRATOR-FIRST EXECUTION MODEL, SDLC
    hooks, DOG-FOOD principle, Queue SLA & Governance, DELEGATE/HANDBACK Protocol, Agent
    Autonomy Model, Task Orchestration, SKILLS role details compacted into the roster
    table, Constraints & Mandatory Rules, Effort Levels, Repository Structure rewritten
    as a ~20-line accurate tree, References trimmed to surviving docs) or deleted
    outright where they describe a deleted subsystem (see affected_sections above for
    the full deletion list).

