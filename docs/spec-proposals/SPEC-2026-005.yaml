impact:
  breaking_for_users: false
  user_impact: |
    None. Behavioural constraints already in force (ORCHESTRATOR-FIRST, direct spawn,
    recursion limits, audit trail) are unchanged in substance; this proposal removes
    stale/contradictory documentation and updates two LOCKED-section facts (a verb and a
    model assignment) that already reflect current reality per SPEC-2026-004 and the
    2026-08-09 Orchestrator model switch commit (2b6e268).
  code_impact: none (documentation only)
  observability_impact: none
  integrity_impact: |
    Removes ~14 residual polling references that contradicted the already-adopted
    direct-spawn model, closing a self-contradiction the document has carried since
    SPEC-2026-004.
  risk: |
    Low. Primary risk is losing institutional detail carried in deleted sections
    (span-capture schema, opus-variant selection tables, token-visibility CLI
    references) — mitigated because the underlying code/tooling for those sections is
    itself deleted elsewhere in this slimdown, so the documentation accurately tracks
    reality post-deletion.

compatibility_notes: |
  Backward compatible. No queue paths, protocol field names, or DELEGATE/HANDBACK schema
