proposed_changes:
  "Integration & Polling Architecture": |
    ### Integration & Polling Architecture

    The Orchestrator operates in two modes:

    1. **Harness-Initiated Polling** (default)
       - Each harness (OpenCode, Copilot, Claude, PI) owns its own idle-loop via OrchestratorSkill.run_idle_loop()
       - Harness wakes up on a schedule (typically every 5 minutes) and calls the orchestrator
       - Orchestrator checks the queue for pending work and dispatches tasks
       - This model avoids long-running daemons and integrates cleanly with harness lifecycle

    2. **Direct Queue Polling** (test/debug mode)
       - Direct calls to orchestrator_skill.execute() for testing
       - Useful for development and CI/CD workflows
       - Requires explicit harness integration

    See AGENTS.md for the complete routing decision tree and integration points per harness.

