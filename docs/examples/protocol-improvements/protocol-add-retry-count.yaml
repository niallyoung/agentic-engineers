---
# Example: Protocol Improvement - Add Retry Count Field
# This DELEGATE demonstrates the self-referential workflow.
# 
# Objective: Add optional 'retry_count' field to HANDBACK extensions
# Risk Level: LOW (optional field, backward-compatible)
# Expected Pass Rate: >99%

task_id: protocol-add-retry-count
skill: consistency-checker
agent: quality-engineer
scope: Add optional retry_count field to HANDBACK extensions for improved retry tracking and failure diagnostics across all agent types and task types
success_criteria:
  - New field 'retry_count' added to specs/protocol-core-v1.0.yaml under handback.extensions
  - consistency-checker run against a sample of recent DELEGATE/HANDBACK records reports pass_rate >= 95%
  - No violations related to new field (may have pre-existing issues)
  - All Phase 1-3 HANDBACKs still validate successfully
  - Test coverage >= 95% with new field validation
plan:
  - Define retry_count field in protocol spec (integer, >=0, optional)
  - Update protocol-validator extension validation rules
  - Create proposed spec at specs/protocol-core-v1.0-retry-count.yaml
  - Run consistency-checker with proposed spec against a sample of recent DELEGATE/HANDBACK records
  - Generate impact report and verify pass_rate >= 95%
  - If approved, merge proposed spec into protocol-core-v1.0.yaml
  - Update protocol-validator tests to cover new field
context: |
  Current protocol lacks explicit retry_count field. Agents report retry attempts
  via retry_context object, but no standardized retry counter exists.
  
  This improvement adds a simple integer counter for:
  - Tracking how many times a task was retried
  - Detecting retry loops (retry_count > 3 indicates potential issue)
  - Generating retry metrics for Model Engineer analysis
  
  Since field is optional (extension), all existing HANDBACKs remain valid.
  Backward compatibility is guaranteed.

# Optional extension fields for this protocol improvement task
effort: medium
priority: 7
dependencies:
  - protocol-validator  # Validator must support new field
  - consistency-checker  # Must validate impact
parent_task_id: null  # Top-level improvement

# Proposed spec changes (inline for clarity)
# Can also be provided as file reference in context above
_proposed_changes:
  path: specs/protocol-core-v1.0-retry-count.yaml
  changes:
    - field: "handback.extensions.retry_count"
      type: "integer"
      minimum: 0
      description: "Number of retries for this task (0 = first attempt, 1 = first retry, etc.)"
      example: 2
  impact: "ADDITIVE - new optional field, no breaking changes"
