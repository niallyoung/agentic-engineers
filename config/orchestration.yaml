# config/orchestration.yaml — Unified Orchestration Configuration
#
# Single source of truth for all orchestrator settings.
#
# Dispatch model (post framework-slimdown, queue removed per SPEC-2026-009): the
# Orchestrator spawns specialist sub-agents directly (Agent/Task tool) and reads the
# HANDBACK back as the spawn call's result. There is no filesystem queue — the harness
# session transcript is the durable audit record.

# ---------------------------------------------------------------------------
# Token Budget (previously config/token_budget.yaml)
# ---------------------------------------------------------------------------
#
# NOTE (measured 2026-10-03, docs/model-evidence/sonnet-opus-5-5-measurement.md): these are
# USD ceilings. Current pins: Orchestrator/Lead/Quality/Senior/Model Engineer on
# claude-sonnet-5.5 ($2 input / $10 output per MTok), Principal on claude-opus-5.5 ($4 / $20)
# (prices from config/models.yaml facts, official pricing page).
# Measured on identical prompts through the real CLI (n=2, spot check, not a benchmark):
#   * tokenizer, 5.5 vs 5: ratio 1.000 on both prompts, Sonnet and Opus. No re-baseline.
#   * Sonnet 4.6 -> 5.x: 1.25x (1.4k-token prompt) to 1.48x (short prompt) input tokens, but the
#     price fell from $3 to $2 input: input cost per text = (1.25..1.48) x 2/3 = 0.83..0.99x.
#     The earlier claim that Sonnet 5 "keeps $3/$15" was wrong (official page: $2/$10).
#   * output tokens vary +31% to -76% between versions per prompt, within run-to-run noise for
#     some cells; too noisy to scale a budget from.
# Decision: no meaningful measured increase in cost per identical input, so the ceilings below
# are unchanged (previous value kept: session_usd 5.00, daily_usd 20.00). Re-measure with
# count_tokens/real traffic before tightening them.
budget:
  # Maximum USD spend per session (single orchestrator run)
  session_usd: 5.00

  # Maximum USD spend per calendar day (24-hour window)
  daily_usd: 20.00

  # Warning threshold: percentage of budget at which to emit warnings
  warn_pct: 70

  # Critical threshold: percentage at which to escalate to critical alerts
  critical_pct: 90

  # Block threshold: percentage at which to block new task execution
  block_pct: 100

# Display configuration for budget status reporting
display:
  # Display mode: "compact" (single line) or "detailed" (multi-line with breakdown)
  mode: compact

  # Show budget status line after each task execution
  show_per_task: true

  # Show comprehensive budget summary at end of session
  show_session_summary: true

# ---------------------------------------------------------------------------
# Deployment (previously config/deployment.yaml)
# ---------------------------------------------------------------------------
deployment:
  mode: gradual_rollout  # dry_run | shadow | gradual_rollout | production

  dry_run:
    enabled: false
    collect_metrics: true

  shadow:
    enabled: false
    traffic_pct: 10

  gradual_rollout:
    enabled: true
    stages:
      - traffic_pct: 10
        duration_hours: 24
      - traffic_pct: 25
        duration_hours: 24
      - traffic_pct: 50
        duration_hours: 24
      - traffic_pct: 75
        duration_hours: 24
      - traffic_pct: 100
        duration_hours: 0  # permanent — no automatic advancement

  monitoring:
    enabled: true
    alert_on_errors: true
    alert_on_performance_degradation: true

  rollback:
    enabled: true
    auto_rollback_on_critical_error: true

# ---------------------------------------------------------------------------
# Quality Gates
# ---------------------------------------------------------------------------
quality:
  # Minimum quality score to PROCEED without review
  proceed_threshold: 80

  # Gray-zone range: route to Lead Engineer for manual review
  gray_zone_min: 70
  gray_zone_max: 79

  # Rework range: auto-retry with same agent
  rework_min: 60
  rework_max: 69

  # Below this score: escalate immediately to Principal Engineer
  escalate_threshold: 60
