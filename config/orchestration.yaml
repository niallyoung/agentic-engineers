# config/orchestration.yaml — Unified Orchestration Configuration
#
# Single source of truth for all orchestrator settings.
# Consolidates config/token_budget.yaml and config/deployment.yaml.
#
# Loader: src/orchestration/deployment/config_loader.py
# (token_budget.yaml and deployment.yaml remain as standalone files
#  for backward compatibility; this file adds a unified view.)

# ---------------------------------------------------------------------------
# Token Budget (previously config/token_budget.yaml)
# ---------------------------------------------------------------------------
#
# NOTE (model upgrade): these are USD ceilings, so they are unaffected by model
# *naming* but are affected by the Sonnet 5 tokenizer. Sonnet 5 keeps Sonnet
# 4.6's $3/$15 per MTok yet emits ~30% more tokens for the same text, so the
# four Sonnet roles consume budget ~30% faster than the historical figures these
# ceilings were set against. Re-baseline with count_tokens against the new model
# before tightening or trusting them; do not scale old token counts.
budget:
  # Maximum USD spend per session (single orchestrator run)
  session_usd: 5.00

  # Maximum USD spend per calendar day (24-hour window)
  daily_usd: 20.00

  # Warning threshold: percentage of budget at which to emit warnings
  warn_pct: 70

  # Critical threshold: percentage at which to escalate to critical alerts
  critical_pct: 90

  # Block threshold: percentage at which to block new task execution
  block_pct: 100

# Display configuration for budget status reporting
display:
  # Display mode: "compact" (single line) or "detailed" (multi-line with breakdown)
  mode: compact

  # Show budget status line after each task execution
  show_per_task: true

  # Show comprehensive budget summary at end of session
  show_session_summary: true

# ---------------------------------------------------------------------------
# Deployment (previously config/deployment.yaml)
# ---------------------------------------------------------------------------
deployment:
  mode: gradual_rollout  # dry_run | shadow | gradual_rollout | production

  dry_run:
    enabled: false
    collect_metrics: true

  shadow:
    enabled: false
    traffic_pct: 10

  gradual_rollout:
    enabled: true
    stages:
      - traffic_pct: 10
        duration_hours: 24
      - traffic_pct: 25
        duration_hours: 24
      - traffic_pct: 50
        duration_hours: 24
      - traffic_pct: 75
        duration_hours: 24
      - traffic_pct: 100
        duration_hours: 0  # permanent — no automatic advancement

  monitoring:
    enabled: true
    alert_on_errors: true
    alert_on_performance_degradation: true

  rollback:
    enabled: true
    auto_rollback_on_critical_error: true

# ---------------------------------------------------------------------------
# Orchestrator Polling
# ---------------------------------------------------------------------------
orchestrator:
  # Seconds of queue inactivity before the polling loop exits
  idle_timeout_seconds: 60

  # Polling interval when queue is empty (seconds)
  poll_interval_seconds: 10

  # Maximum task retries before escalation to Principal Engineer
  max_retries: 2

# ---------------------------------------------------------------------------
# Quality Gates
# ---------------------------------------------------------------------------
quality:
  # Minimum quality score to PROCEED without review
  proceed_threshold: 80

  # Gray-zone range: route to Lead Engineer for manual review
  gray_zone_min: 70
  gray_zone_max: 79

  # Rework range: auto-retry with same agent
  rework_min: 60
  rework_max: 69

  # Below this score: escalate immediately to Principal Engineer
  escalate_threshold: 60
