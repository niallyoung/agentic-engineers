[pytest]
# TEST COUNTS — the two numbers below are different on purpose:
#   `pytest tests/`  -> 691  (the repo's own suite; this is the number the
#                             regression floor in
#                             renderer/scripts/check_test_regression.py tracks)
#   `pytest`         -> 980  (= 691 + the 289 skill-local tests below, because
#                             `testpaths` names three skill tests/ dirs too)
# Confusing the two is the standard way to mis-set the regression floor.
# The 289 skill-local tests are separately floored by MIN_EXPECTED_TESTS in
# scripts/run_skill_tests.py — that gate tracks 289, NOT 691.
#
# NOTE on skill tests (C6): src/skills/*/tests/ holds 289 tests across the 3
# script-backed skills remaining after the queue-removal work, on top of the
# SPEC-2026-005 slimdown (protocol-validator 187, spec-validator 99,
# skill-improvement-feedback 3). Historically NONE of them were in testpaths,
# for the sys.modules reason below; the three named in `testpaths` today were
# added later (see the WP-R3-04 paragraph at the end) precisely because they
# do NOT hit that collision. Any skill NOT listed there is still excluded and
# still runs only via `make test-skills`. Many skills import their
# own `scripts` package
# via `sys.path.insert(0, <own skill dir>); from scripts.foo import Bar`.
# Since every skill's scripts/ dir is a regular package (has __init__.py),
# collecting them together in one process makes Python cache the FIRST
# `scripts` package it resolves under sys.modules['scripts'] — every other
# skill's `from scripts.X import Y` then silently resolves against the wrong
# skill (or fails outright). The `pythonpath` list this used to carry
# (queue-management, file-sync, pre-gate-security, cost-budgeting,
# model-selection — queue-management itself has since been deleted along
# with the filesystem queue it managed) was a symptom of exactly this
# problem, was already broken (pre-gate-security doesn't exist; the other 4
# collided with each other), and was never exercised end-to-end because
# testpaths excluded skill tests entirely.
#
# Skill tests DO run in CI: `make test-skills` (scripts/run_skill_tests.py)
# runs each skill's tests/ dir in its own subprocess — one fresh
# sys.modules per skill, exactly like running `pytest src/skills/<skill>/tests`
# standalone — and is wired into `make test` / CI. See that script's
# module docstring for the full rationale.
#
# Expanded in WP-R3-04 to also collect from skill-local test directories.
# This allows skill-specific test suites (e.g. protocol-validator, spec-validator)
# to be run with `pytest` without needing separate subprocess handling, as long
# as they don't have the same scripts/ package name conflicts.
pythonpath = .
testpaths = tests src/skills/protocol-validator/tests src/skills/spec-validator/tests src/skills/skill-improvement-feedback/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
