[pytest]
# NOTE on skill tests (C6): src/skills/*/tests/ (~1,200 tests across 35
# skills) are intentionally NOT in testpaths and are NOT collected by a bare
# `pytest` run here. Many of those skills import their own `scripts` package
# via `sys.path.insert(0, <own skill dir>); from scripts.foo import Bar`.
# Since every skill's scripts/ dir is a regular package (has __init__.py),
# collecting them together in one process makes Python cache the FIRST
# `scripts` package it resolves under sys.modules['scripts'] — every other
# skill's `from scripts.X import Y` then silently resolves against the wrong
# skill (or fails outright). The `pythonpath` list this used to carry
# (queue-management, file-sync, pre-gate-security, cost-budgeting,
# model-selection) was a symptom of exactly this problem, was already broken
# (pre-gate-security doesn't exist; the other 4 collided with each other),
# and was never exercised end-to-end because testpaths excluded skill tests
# entirely.
#
# Skill tests DO run in CI: `make test-skills` (scripts/run_skill_tests.py)
# runs each skill's tests/ dir in its own subprocess — one fresh
# sys.modules per skill, exactly like running `pytest src/skills/<skill>/tests`
# standalone — and is wired into `make test` / CI. See that script's
# module docstring for the full rationale.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
