       - Report final status
       - Generate artifacts/index.json
       - Exit gracefully
success_criteria:
  - All pending DELEGATE blocks are delegated
  - Each delegated to correct agent per AGENTS.md
  - HANDBACK received and processed
  - Tasks moved to done/ queue
