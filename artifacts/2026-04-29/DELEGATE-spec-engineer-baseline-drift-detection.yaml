  - Specification: docs/SPEC.md (v1.0, just approved)
  - Code base:  (latest)
  - Status: Spec-Engineer role is 5th Quality Gate sub-agent
  - Objective: First baseline drift detection; establish compliance baseline

task:
  1. READ docs/SPEC.md (full document, v1.0)
     Extract documented features:
     - All 13 agents (names, models, effort, roles)
     - DELEGATE/HANDBACK/FEEDBACK protocol
     - 3 feedback loops (Quality Gate, Model Engineer, Config Enforcement)
     - Routing rules (6-point decision tree)
     - Artifact storage paths
     - Skills (spec-extract, config-audit, etc.)
     - Cost model

  2. READ current code (orchestration/ and skills/ directories)
     - Are all 13 agents implemented? (orchestration/agents/*.md files)
     - Are DELEGATE/HANDBACK blocks being used? (check example files in guides/)
     - Are 3 feedback loops implemented? (orchestration/handlers/*.md)
     - Are routing rules implemented? (orchestration/AGENTS.md)
     - Are artifacts/ paths consistent with spec?
     - Are skills available? (skills/*.md files)

  3. COMPARE: Specification vs. Code (detect drift types)

     DRIFT TYPE A — Documented Feature Missing from Code
     Example: "Spec documents Engineer Agent with Haiku; code has no Engineer Agent"
     Assessment: Is every agent in spec actually implemented in code?

     DRIFT TYPE B — Code Feature Not in Specification
     Example: "Code implements new 'Logging Agent' not mentioned in spec"
     Assessment: Are there agents/skills/loops in code not documented in spec?

     DRIFT TYPE C — Specification and Code Disagree
     Example: "Spec says Engineer is Haiku 4.5, code shows Sonnet 4.5"
     Assessment: Do implementation details match spec (model, effort, cost)?

     DRIFT TYPE D — Breaking Change Without Deprecation Notice
     Example: "Spec documents Quality Engineer, code has Quality Engineer removed"
     Assessment: Are any documented features deleted from code?

  4. DETAILED VALIDATION:

     a) **Agent Inventory (TYPE_A/B/C):**
        - Spec documents: Orchestrator, Engineer, Senior Engineer, Lead Engineer,
          Principal Engineer, Security Engineer, Quality Engineer, Model Engineer,
          Quality Gate Orchestrator, Security Agent (QG), Testing Agent (QG),
          Metrics Agent (QG), Healing Agent (QG), Spec Engineer (QG)
        - Code status: Check orchestration/agents/ directory (count .md files)
        - For each agent:
          * File exists? (TYPE_A if missing)
          * Name matches spec? (TYPE_C if mismatch)
          * Model matches? (TYPE_C if Opus/Sonnet/Haiku differs)
          * Effort matches? (TYPE_C if low/medium/high differs)

     b) **Protocol Compliance (TYPE_C):**
        - DELEGATE block structure: Is it YAML? Does it include all required fields?
        - HANDBACK block structure: Same validation
        - Examples in docs/guides/examples/ — do they match spec format?

     c) **Feedback Loops (TYPE_A/B):**
        - Quality Gate Feedback Handler: Does it exist (orchestration/handlers/)? Does logic match spec?
        - Model Engineer Feedback Handler: Exists? Logic matches confidence algorithm (+0.15/-0.20, bounds 0.30-1.00)?
        - Config Enforcement Feedback Handler: Exists? Three-tier thresholds (0.95, 0.80-0.95, <0.80) implemented?

     d) **Routing Rules (TYPE_C):**
        - Spec shows 6-point decision tree; does AGENTS.md match exactly?
        - Are all role names spelled consistently?
        - Are mandatory constraints documented (Engineer needs plan, etc.)?

     e) **Skills (TYPE_A/B):**
        - Spec lists 10+ domain skills; are they all in skills/ directory?
        - Type_A if: spec mentions skill not in code
        - Type_B if: code has skill not mentioned in spec

     f) **Artifact Paths (TYPE_C):**
        - Spec says: artifacts/delegates/, artifacts/handbacks/, artifacts/feedback/
        - Code uses: artifacts/2026-04-29/DELEGATE-*.yaml, HANDBACK-*.yaml
        - Is this a mismatch (TYPE_C) or acceptable implementation detail?

  5. COMPLIANCE SCORING:
     compliance_score = (features_implemented / features_documented) × 100

     Example:
     - Spec documents: 13 agents
     - Code implements: 13 agents
     - → compliance_score = 100%

  6. DECISION LOGIC:
     IF compliance_score == 100% AND no drift detected:
       → PASS ("Agentic-engineers spec-aligned at baseline")
       → confidence 0.95+

     ELIF TYPE_A detected (documented feature missing from code):
       → ESCALATE HIGH ("Feature X documented in spec but missing from code")
       → severity MEDIUM/HIGH

     ELIF TYPE_B detected (code feature not in spec):
       → ESCALATE MEDIUM ("Feature X implemented but not documented")
       → severity MEDIUM (drift detected; update spec or remove code)

     ELIF TYPE_C detected (spec/code mismatch):
       → ESCALATE MEDIUM ("Agent X: spec says Sonnet, code shows Opus")
       → severity MEDIUM (which is source of truth? reconcile)

     ELIF TYPE_D detected (breaking change without deprecation):
       → ESCALATE HIGH ("Feature X deleted without deprecation notice")
       → severity HIGH

success_criteria:
