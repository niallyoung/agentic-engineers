id: test-handback-validation-001
name: "Test HANDBACK protocol validation"
harnesses:
  - opencode
  - copilot
  - claude-code
  - pi-dev
models:
  - haiku
  - sonnet
  - opus
category: protocol
severity: critical
prompt: |
  Report the result of completing a simple task as a protocol-compliant HANDBACK
  block. Use status "success" and a short output summary. Remember that the
  required HANDBACK fields are task_id, status, output, and a metrics object
  (quality, tokens, cost, duration_seconds) — do not omit the output field.
expected_contains:
  - "HANDBACK"
  - "status"
  - "metrics"
expected_not_contains:
  - "Invalid format"
timeout_seconds: 60
requirements:
  - Must know HANDBACK protocol specification
  - Must emit all required HANDBACK fields including output
