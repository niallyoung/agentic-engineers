id: test-model-guidance-field-parsing-001
name: "Agent Frontmatter - model_guidance Field Validation"
harnesses:
  - claude-code
models:
  - opus
category: agent-metadata
severity: medium
timeout_seconds: 60
requirements:
  - Must understand protocol validation
  - Must know agent SPEC.md schema
prompt: |
  Here is an agent definition with a new model_guidance field:

  ---
  name: principal-engineer
  role: principal
  model: claude-opus-4.6
  model_guidance: |
    Use 4.6 for pure architecture planning.
    Use 4.7 for cross-repo execution impact.
    Use 4.8 for security-critical design.
  ---

  Does this agent definition pass protocol validation?
  Can the Orchestrator accept this agent definition?
  Should the validator reject or accept the model_guidance field?
expected_contains:
  - "valid"
  - "accept"
  - "optional"
expected_not_contains:
  - "error"
  - "reject"
  - "unknown"
