id: test-phase-g-backoff-ladder-001
name: "Phase G - Exponential backoff ladder progression and reset"
harnesses:
  - opencode
  - copilot
  - claude-code
models:
  - haiku
  - sonnet
category: queue-polling
severity: high
timeout_seconds: 90
requirements:
  - Must know the exact backoff ladder 5s, 30s, 180s, 600s
  - Must know 600s is the deep-idle cap
  - Must know a successful poll that finds work resets backoff to level 0 (5s)
prompt: |
  In the HANDBACK output field, describe the Phase G exponential backoff ladder
  used by the harness queue poller when the queue is repeatedly empty. Answer from
  your own knowledge in two or three sentences. Do NOT run tools or read files.

  Your answer MUST state:
  - the ladder advances 5s -> 30s -> 180s -> 600s as the queue stays empty
  - 600s is the deep-idle cap and the interval does not grow beyond it
  - when a poll finds and processes a DELEGATE, the backoff resets to 5s
expected_contains:
  - "5s"
  - "30s"
  - "180s"
  - "600s"
  - "cap"
  - "reset"
expected_not_contains:
  - "Invalid format"
  - "1200s"
