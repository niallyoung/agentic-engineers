id: test-skill-invocation-001
name: "Test skill invocation knowledge"
harnesses:
  - opencode
  - copilot
models:
  - sonnet
  - opus
category: skill
severity: high
prompt: |
  Briefly describe, in the HANDBACK output field, how the spec-validator skill
  is invoked to check DELEGATE/HANDBACK format compliance. Mention the word
  "skill" and the name "spec-validator". Do NOT actually run any tools, read
  files, or explore the repository — answer from your own knowledge in one or
  two sentences.
expected_contains:
  - "skill"
  - "spec-validator"
expected_not_contains:
  - "Invalid format"
timeout_seconds: 90
requirements:
  - Must understand agentic-engineers skill system
  - Must know how skills are invoked and used
