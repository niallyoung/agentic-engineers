id: test-multi-model-delegate-001
name: "DELEGATE Creation - Multi-Model Principal Engineer Selection"
harnesses:
  - claude-code
models:
  - opus
category: delegation
severity: high
timeout_seconds: 60
requirements:
  - Must understand DELEGATE format
  - Must know model variant selection logic
  - Must understand principal engineer role
prompt: |
  Create a DELEGATE for the Principal Engineer to review a complex architectural change.

  Task profile:
  - Spans 3 repositories
  - Involves security-sensitive decisions (auth flow redesign)
  - Requires deep reasoning about attack surfaces and compliance

  According to SPEC.md > Model Selection Architecture:
  - Principal Engineer uses 4.6 for pure planning
  - Principal Engineer uses 4.7 for cross-repo execution impact
  - Principal Engineer uses 4.8 for security-critical design

  Write the DELEGATE block specifying the appropriate model variant.
  Justify your model selection based on the task profile.
expected_contains:
  - "principal-engineer"
  - "opus-4.8"
  - "security"
  - "cross-repo"
  - "model:"
expected_not_contains:
  - "haiku"
  - "sonnet"
  - "4.5"
  - "4.6"
