id: test-delegate-basic-001
name: "Test basic DELEGATE invocation"
harnesses:
  - opencode
  - copilot
  - claude-code
models:
  - haiku
  - sonnet
category: delegation
severity: critical
prompt: |
  Create a DELEGATE task for fixing a simple Python type annotation error.
  The DELEGATE should follow the standard format with task_id, type, role, model,
  context, requirements, acceptance_criteria, and escalation_triggers fields.
expected_contains:
  - "DELEGATE"
  - "task_id"
expected_not_contains:
  - "Invalid format"
timeout_seconds: 60
requirements:
  - Must understand DELEGATE/HANDBACK protocol
  - Must be able to generate structured task blocks
