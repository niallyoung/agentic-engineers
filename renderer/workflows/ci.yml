# Reusable CI workflow — copy into any project's .github/workflows/ci.yml
# Calls `make ci` — all logic stays in the Makefile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline
        run: make ci
